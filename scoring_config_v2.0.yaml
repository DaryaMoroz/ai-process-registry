            VALIDATED_IN_COMPARABLE_CONTEXT: 4
            PARTIALLY_VALIDATED: 3
            NOT_VALIDATED_BUT_TESTABLE: 2
            CONFIRMED_NOT_VIABLE: 1
            UNKNOWN: null
          requires_positive_qualification: true
          unqualified_or_missing: null
          invalid_enum: null
          affecting_conflict: null
        output:
          type: score_or_null
        dependency_refs: []
      F3_VALIDATION_REQUIREMENT_v2.0:
        rule_id: F3_VALIDATION_REQUIREMENT_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§12.2
        kind: ENUM_MAPPING
        input_refs:
        - '#/criteria/F3/inputs'
        precondition_refs: []
        definition:
          operator: enum_lookup
          input:
            select: validation_requirement_level
          mapping:
