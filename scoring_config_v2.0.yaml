                op: and
                args:
                - op: all_eligible
                  args:
                  - select: facts.problem_proxy
                  policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                  purpose: NORMAL
                  input_descriptor_ref: '#/criteria/V5/inputs/problem_proxy'
                - op: eq
                  args:
                  - select: facts.problem_proxy.derivation_provenance.rule_id
                  - literal: DERIVE_PROBLEM_PROXY_v2.0
                - op: ge
                  args:
                  - op: count
                    args:
                    - select: facts.problem_proxy.derivation_provenance.input_fact_versions
                  - literal: 1
            qualitative_eligible:
              type: truth
              expression:
                op: all_eligible
                args:
                - select: facts.problematicity_level
                policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                purpose: NORMAL
                input_descriptor_ref: '#/criteria/V5/inputs/problematicity_level'
            no_eligible_statistics:
              type: truth
              expression:
                op: and
                args:
                - op: not
                  args:
                  - predicate_ref: '#/criteria/V5/rules/V5_PROBLEMATICITY_v2.0/definition/local_predicates/direct_percent_eligible'
                - op: not
                  args:
                  - predicate_ref: '#/criteria/V5/rules/V5_PROBLEMATICITY_v2.0/definition/local_predicates/registered_proxy_eligible'
          first_true_wins: true
          rows:
          - when:
              op: eq
              args:
              - select: affecting_conflict
              - literal: true
            then: null
          - when:
              op: and
              args:
              - op: eq
                args:
                - select: affecting_conflict
                - literal: false
              - predicate_ref: '#/criteria/V5/rules/V5_PROBLEMATICITY_v2.0/definition/local_predicates/direct_percent_eligible'
            then:
              operator: numeric_ranges
              input:
                select: facts.problem_case_share_percent.value
              ranges_ref: '#/criteria/V5/rules/V5_PROBLEMATICITY_v2.0/definition/ranges'
              domain_ref: '#/criteria/V5/rules/V5_PROBLEMATICITY_v2.0/definition/domain'
              invalid_or_missing: null
          - when:
              op: and
              args:
              - op: eq
                args:
                - select: affecting_conflict
                - literal: false
              - op: not
                args:
                - predicate_ref: '#/criteria/V5/rules/V5_PROBLEMATICITY_v2.0/definition/local_predicates/direct_percent_eligible'
              - predicate_ref: '#/criteria/V5/rules/V5_PROBLEMATICITY_v2.0/definition/local_predicates/registered_proxy_eligible'
            then:
              operator: numeric_ranges
              input:
                select: facts.problem_proxy.value
              ranges_ref: '#/criteria/V5/rules/V5_PROBLEMATICITY_v2.0/definition/ranges'
              domain_ref: '#/criteria/V5/rules/V5_PROBLEMATICITY_v2.0/definition/domain'
              invalid_or_missing: null
          - when:
              op: and
              args:
              - op: eq
                args:
                - select: affecting_conflict
                - literal: false
              - predicate_ref: '#/criteria/V5/rules/V5_PROBLEMATICITY_v2.0/definition/local_predicates/no_eligible_statistics'
              - predicate_ref: '#/criteria/V5/rules/V5_PROBLEMATICITY_v2.0/definition/local_predicates/qualitative_eligible'
            then:
              operator: enum_lookup
              input:
                select: facts.problematicity_level.value
              mapping_ref: '#/criteria/V5/rules/V5_PROBLEMATICITY_v2.0/definition/qualitative_mapping'
              invalid_or_missing: null
          otherwise: null
        output:
          type: score_or_null
        dependency_refs:
        - '#/derivations/rules/DERIVE_PROBLEM_PROXY_v2.0'
  F1:
    axis: FEASIBILITY
    root_rule_ref: '#/criteria/F1/rules/F1_DATA_AVAILABILITY_READINESS_v2.0'
    inputs:
