        rule_id: F3_COMPONENT_MIN_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§12.3
        kind: AGGREGATION
        input_refs:
        - '#/criteria/F3/inputs'
        precondition_refs: []
        definition:
          operator: strict_min
          inputs:
          - select: maturity_score
          - select: target_validation_score
          - select: validation_requirement_score
          mandatory_complete_set: true
          on_unknown_or_conflict: null
          on_empty: null
          retain_all_ties: true
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F3/rules/F3_PATTERN_MATURITY_v2.0'
        - '#/criteria/F3/rules/F3_TARGET_VALIDATION_v2.0'
        - '#/criteria/F3/rules/F3_VALIDATION_REQUIREMENT_v2.0'
        - '#/derivations/rules/DERIVE_F3_TARGET_VALIDATION_v2.0'
        - '#/derivations/rules/DERIVE_F3_VALIDATION_REQUIREMENT_v2.0'
        - '#/criteria/F3/rules/F3_CONSISTENCY_v2.0'
        - '#/aggregation/rules/COMMON_STRICT_MIN_v2.0'
      F3_SOLUTION_MIN_v2.0:
        rule_id: F3_SOLUTION_MIN_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§12.3
        kind: AGGREGATION
        input_refs:
        - '#/criteria/F3/inputs'
        precondition_refs: []
        definition:
          operator: strict_min
          inputs:
          - select: included_component_scores
          mandatory_complete_set: true
          on_unknown_or_conflict: null
          on_empty: null
          retain_all_ties: true
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F3/rules/F3_COMPONENT_MIN_v2.0'
        - '#/criteria/F3/rules/F3_CAPABILITY_COMPLETENESS_v2.0'
        - '#/aggregation/rules/COMMON_STRICT_MIN_v2.0'
      F3_TECHNICAL_SOLUTION_MATURITY_v2.0:
        rule_id: F3_TECHNICAL_SOLUTION_MATURITY_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§12
        kind: GATE
        input_refs:
        - '#/criteria/F3/inputs'
        precondition_refs:
        - '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
        - '#/evidence_policy/rules/COMMON_CONFLICT_NULL_v2.0'
        - '#/owner_filtering/rules/COMMON_OWNER_FILTER_v2.0'
        definition:
          operator: ordered_decision_table
          first_true_wins: true
          unknown_condition: continue_without_treating_as_false_evidence
          rows:
          - when:
              op: is_null
              args:
              - select: gate_result
            then: null
          - when:
              op: eq
              args:
              - select: gate_result
              - literal: 5
            then:
              literal: 5
          - when:
              op: or
              args:
              - op: ne
                args:
                - select: solution_approach_defined
                - literal: true
              - op: ne
                args:
                - select: technical_success_criteria_defined
                - literal: true
              - op: eq
                args:
                - select: capability_completeness_unproven
                - literal: true
            then: null
          - when:
              op: eq
              args:
              - select: required_branch_complete
              - literal: true
            then:
              rule_ref: '#/criteria/F3/rules/F3_SOLUTION_MIN_v2.0'
              bindings: {}
          otherwise: null
          mandatory_unknown_cannot_be_numeric: true
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F3/rules/F3_REQUIREMENT_GATE_v2.0'
        - '#/criteria/F3/rules/F3_CAPABILITY_COMPLETENESS_v2.0'
        - '#/criteria/F3/rules/F3_SOLUTION_MIN_v2.0'
  F4:
    axis: FEASIBILITY
    root_rule_ref: '#/criteria/F4/rules/F4_REGULATORY_ORGANIZATIONAL_CONSTRAINTS_v2.0'
    inputs:
      constraint_domain_reviews:
