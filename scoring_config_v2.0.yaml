        confirmation_policy_requirement_ref: '#/confirmation_policy/policy_requirements'
        context_ref: '#/methodology/context_requirements/HypothesisAssessment'
        applicability_branch_ref: '#/applicability_policy/normal_branch'
        required_when:
          literal: true
        missing_outcome: null
        conflict_outcome: null
        provenance_requirement_ref: '#/evidence_policy/trace_requirements'
      mandatory_constraints:
        fact_id: mandatory_constraints
        type_ref: '#/methodology/type_catalog/Collection'
        unit: not_applicable
        domain:
          type: collection
        allowed_statuses:
        - Confirmed
        source_policy_ref: '#/evidence_policy/fact_requirements'
        confirmation_policy_requirement_ref: '#/confirmation_policy/policy_requirements'
        context_ref: '#/methodology/context_requirements/HypothesisAssessment'
        applicability_branch_ref: '#/applicability_policy/normal_branch'
        required_when:
          op: gt
          args:
          - op: count
            args:
            - op: filter
              args:
              - select: constraint_domain_reviews.items
