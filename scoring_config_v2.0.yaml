            CONFIRMATORY_TEST: 4
            BOUNDED_POC: 3
            CRITICAL_POC: 2
            R_AND_D: 1
            UNKNOWN: null
          requires_positive_qualification: true
          unqualified_or_missing: null
          invalid_enum: null
          affecting_conflict: null
        output:
          type: score_or_null
        dependency_refs: []
      F3_COMPARABILITY_v2.0:
        rule_id: F3_COMPARABILITY_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§12.5
        kind: COMPLETENESS
        input_refs:
        - '#/criteria/F3/inputs'
        precondition_refs: []
        definition:
          operator: all
          dimensions:
          - FUNCTIONAL_TASK
          - INPUT_CHARACTERISTICS
          - SCALE_AND_LOAD
          - QUALITY_OR_ACCURACY_REQUIREMENTS
          - RUNTIME_ENVIRONMENT
          - INTEGRATION_DEPENDENCIES
          - RELIABILITY_AND_AVAILABILITY_REQUIREMENTS
          - TECHNICAL_SECURITY_CONSTRAINTS
          state_enum:
          - MATCH
          - MATERIAL_DIFFERENCE_ADDRESSED
          - MATERIAL_DIFFERENCE_UNRESOLVED
          - UNKNOWN
          - CONFIRMED_NOT_APPLICABLE
          applicable_accepted_states:
          - MATCH
          - MATERIAL_DIFFERENCE_ADDRESSED
          addressed_requires_evidence: true
          exclusion_ref: '#/applicability_policy/exclusion_allowlist/1'
          unknown_or_invalid_qualification: NOT_PROVEN
          numeric_score_from_exclusion: false
        output:
          type: comparable_predicate
        dependency_refs: []
      F3_CONSISTENCY_v2.0:
        rule_id: F3_CONSISTENCY_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§12.7
        kind: CONSISTENCY
        input_refs:
        - '#/criteria/F3/inputs'
        precondition_refs: []
        definition:
          operator: ordered_decision_table
          first_true_wins: true
          unknown_condition: continue_without_treating_as_false_evidence
          rows:
          - when:
              op: eq
              args:
              - select: same_context_proposition_contradiction
              - literal: true
            then:
              result: null
              reason: INCONSISTENT_TECHNICAL_EVIDENCE_STATE
          otherwise:
            literal: CONSISTENT
          nonviable_with_none_allowed: true
        output:
          type: consistent_or_null
        dependency_refs: []
