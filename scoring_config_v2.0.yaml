    - '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0'
    - '#/criteria/F2/rules/F2_MATERIAL_DEGRADED_PATH_v2.0'
    - '#/criteria/F2/rules/F2_TOPOLOGY_v2.0'
    - '#/criteria/F2/rules/F2_INTERACTIONS_MIN_v2.0'
    - '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0'
    rules:
      F2_CONFIRMED_NOT_REQUIRED_v2.0:
        rule_id: F2_CONFIRMED_NOT_REQUIRED_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11
        kind: GATE
        input_refs:
        - '#/criteria/F2/inputs'
        precondition_refs: []
        definition:
          operator: all
          required_predicates:
          - absence_business_scope_confirmed
          - absence_profile_dependency_confirmed
          - sufficient_scope_context
          true_outcome: 5
          otherwise: null
          empty_requirements_is_evidence: false
        output:
          type: score_or_null
        dependency_refs:
        - '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
        - '#/evidence_policy/rules/COMMON_CONFLICT_NULL_v2.0'
        - '#/owner_filtering/rules/COMMON_OWNER_FILTER_v2.0'
      F2_REQUIREMENT_GATE_v2.0:
        rule_id: F2_REQUIREMENT_GATE_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11
        kind: GATE
        input_refs:
        - '#/criteria/F2/inputs'
        precondition_refs: []
        definition:
          operator: ordered_decision_table
          first_true_wins: true
          unknown_condition: continue_without_treating_as_false_evidence
          rows:
          - when:
              op: eq
              args:
              - select: integration_requirement_status
              - literal: CONFIRMED_NOT_REQUIRED
            then:
              rule_ref: '#/criteria/F2/rules/F2_CONFIRMED_NOT_REQUIRED_v2.0'
              bindings: {}
          - when:
              op: eq
              args:
              - select: integration_requirement_status
              - literal: REQUIRED
            then:
              literal: EVALUATE_REQUIRED
          otherwise: null
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F2/rules/F2_CONFIRMED_NOT_REQUIRED_v2.0'
      F2_PATH_SELECTION_v2.0:
        rule_id: F2_PATH_SELECTION_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11
        kind: SELECTION
        input_refs:
        - '#/methodology/type_catalog/IntegrationPath'
        - '#/methodology/type_catalog/IntegrationRequirement'
        precondition_refs: []
        definition:
          operator: cardinality
          collection: effective_selected_paths_per_included_interaction
          included_criticalities:
          - CRITICAL
          - MATERIAL
          excluded_confirmed_criticality: OPTIONAL
          expected: 1
          zero:
            result: null
            reason: TECHNICAL_PATH_NOT_SELECTED
          multiple:
            result: null
            reason: MULTIPLE_TECHNICAL_PATHS_SELECTED
          unknown_criticality: null
          joint_mode: EXPLICIT_EFFECTIVE_COMBINATION
          no_path_exception_rule_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0'
          unselected: TRACE_REVIEW_ONLY
        output:
          type: effective_selected_path_or_null
        dependency_refs: []
      F2_INTERFACE_v2.0:
        rule_id: F2_INTERFACE_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11.2
        kind: ENUM_MAPPING
        input_refs:
        - '#/criteria/F2/inputs'
        precondition_refs: []
        definition:
          operator: enum_lookup
          input:
            select: interface_standardization_level
          mapping:
            STANDARD_DOCUMENTED: 5
            CUSTOM_DOCUMENTED: 4
            LEGACY_DOCUMENTED: 3
            LEGACY_OR_UNDOCUMENTED: 2
            UNKNOWN: null
          requires_positive_qualification: true
          unqualified_or_missing: null
          invalid_enum: null
          affecting_conflict: null
        output:
          type: score_or_null
        dependency_refs: []
      F2_FORMAT_v2.0:
        rule_id: F2_FORMAT_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11.2
        kind: ENUM_MAPPING
        input_refs:
        - '#/criteria/F2/inputs'
        precondition_refs: []
        definition:
          operator: enum_lookup
          input:
            select: format_compatibility_level
          mapping:
            COMPATIBLE: 5
            MINOR_TRANSFORMATION: 4
            MATERIAL_TRANSFORMATION: 3
            MAJOR_TRANSFORMATION: 2
            INCOMPATIBLE: 1
            UNKNOWN: null
          requires_positive_qualification: true
          unqualified_or_missing: null
          invalid_enum: null
          affecting_conflict: null
        output:
          type: score_or_null
        dependency_refs: []
      F2_ADAPTER_v2.0:
        rule_id: F2_ADAPTER_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11.2
        kind: ENUM_MAPPING
        input_refs:
        - '#/criteria/F2/inputs'
        precondition_refs: []
        definition:
          operator: enum_lookup
          input:
            select: adapter_complexity_level
          mapping:
            NONE: 5
            CONFIGURATION_ONLY: 4
            CUSTOM_STANDARD_PATTERN: 3
            CUSTOM_COMPLEX: 2
            NO_VIABLE_ADAPTER: 1
            UNKNOWN: null
          requires_positive_qualification: true
          unqualified_or_missing: null
          invalid_enum: null
          affecting_conflict: null
        output:
          type: score_or_null
        dependency_refs: []
      F2_RELIABILITY_v2.0:
        rule_id: F2_RELIABILITY_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11.2
        kind: ENUM_MAPPING
        input_refs:
        - '#/criteria/F2/inputs'
        precondition_refs: []
        definition:
          operator: enum_lookup
          input:
            select: exchange_reliability_level
          mapping:
            PROVEN_FOR_REQUIRED_MODE: 5
            PROVEN_WITH_MINOR_LIMITATIONS: 4
            PROVEN_WITH_MATERIAL_LIMITATIONS: 3
            UNPROVEN_BUT_TECHNICALLY_PLAUSIBLE: 2
            CONFIRMED_INADEQUATE: 1
            UNKNOWN: null
          requires_positive_qualification: true
          unqualified_or_missing: null
          invalid_enum: null
          affecting_conflict: null
        output:
          type: score_or_null
        dependency_refs: []
      F2_PATH_MIN_v2.0:
        rule_id: F2_PATH_MIN_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11.3
        kind: AGGREGATION
        input_refs:
        - '#/criteria/F2/inputs'
        precondition_refs: []
        definition:
          operator: strict_min
          inputs:
          - select: interface_score
          - select: format_score
          - select: adapter_score
          - select: reliability_score
          mandatory_complete_set: true
          on_unknown_or_conflict: null
          on_empty: null
          retain_all_ties: true
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F2/rules/F2_INTERFACE_v2.0'
        - '#/criteria/F2/rules/F2_FORMAT_v2.0'
        - '#/criteria/F2/rules/F2_ADAPTER_v2.0'
        - '#/criteria/F2/rules/F2_RELIABILITY_v2.0'
        - '#/aggregation/rules/COMMON_STRICT_MIN_v2.0'
      F2_CRITICAL_NO_MECHANISM_v2.0:
        rule_id: F2_CRITICAL_NO_MECHANISM_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11.3
        kind: PREDICATE
        input_refs:
        - '#/criteria/F2/inputs'
        precondition_refs: []
        definition:
          operator: and
          required_predicates:
          - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/critical_interaction'
          - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/no_viable_full_path'
          - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/complete_full_substitute_review'
          - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/no_viable_substitute'
          - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/own_technical_cause_F2'
          true_outcome: 1
          unknown_outcome: null
          nonexistent_components_required: false
          local_input_types:
            interaction:
              type_ref: '#/methodology/type_catalog/IntegrationRequirement'
              qualification_required: true
            review:
              type_ref: '#/methodology/type_catalog/AlternativeReview'
              qualification_required: true
              qualified_boolean_propositions:
              - no_viable_full_path
              - no_viable_substitute
              preserves_current_hypothesis_scope_required: true
            own_cause:
              type_ref: '#/owner_filtering/cause_requirements'
              confirmation_and_context_qualification_required: true
          local_predicates:
            critical_interaction:
              type: truth
              expression:
                op: and
                args:
                - op: all_eligible
                  args:
                  - select: interaction
                  policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                  purpose: NORMAL
                  input_type_ref: '#/methodology/type_catalog/IntegrationRequirement'
                - op: eq
                  args:
                  - select: interaction.criticality
                  - literal: CRITICAL
            no_viable_full_path:
              type: truth
              expression:
                op: and
                args:
                - op: all_eligible
                  args:
                  - select: review.no_viable_full_path
                  policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                  purpose: NORMAL
                  input_type_ref: '#/methodology/type_catalog/Fact'
                - op: eq
                  args:
                  - select: review.no_viable_full_path.status
                  - literal: Confirmed
                - op: eq
                  args:
                  - select: review.no_viable_full_path.value
                  - literal: true
            complete_full_substitute_review:
              type: truth
              expression:
                op: and
                args:
                - op: all_eligible
                  args:
                  - select: review
                  policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                  purpose: NORMAL
                  input_type_ref: '#/methodology/type_catalog/AlternativeReview'
                - op: eq
                  args:
                  - select: review.completeness
                  - literal: COMPLETE
            no_viable_substitute:
              type: truth
              expression:
                op: and
                args:
                - op: all_eligible
                  args:
                  - select: review.no_viable_substitute
                  policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                  purpose: NORMAL
                  input_type_ref: '#/methodology/type_catalog/Fact'
                - op: eq
                  args:
                  - select: review.no_viable_substitute.status
                  - literal: Confirmed
                - op: eq
                  args:
                  - select: review.no_viable_substitute.value
                  - literal: true
            own_technical_cause_F2:
              type: truth
              expression:
                op: and
                args:
                - op: all_eligible
                  args:
                  - select: own_cause
                  policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                  purpose: NORMAL
                  input_type_ref: '#/owner_filtering/cause_requirements'
                - op: eq
                  args:
                  - select: own_cause.fact_status
                  - literal: Confirmed
                - op: eq
                  args:
                  - select: own_cause.primary_scoring_owner
                  - literal: F2
          false_outcome: null
        output:
          type: score_or_null
        dependency_refs: []
      F2_MATERIAL_DEGRADED_PATH_v2.0:
        rule_id: F2_MATERIAL_DEGRADED_PATH_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11.3
        kind: AGGREGATION
        input_refs:
        - '#/criteria/F2/inputs'
        precondition_refs: []
        definition:
          operator: ordered_decision_table
          first_true_wins: true
          unknown_condition: continue_without_treating_as_false_evidence
          rows:
          - when:
              op: eq
              args:
              - select: mandatory_path_component_unknown
              - literal: true
            then: null
          - when:
              op: and
              args:
              - op: eq
                args:
                - select: criticality
                - literal: MATERIAL
              - op: eq
                args:
                - select: service
                - literal: DEGRADED
              - op: eq
                args:
                - select: viability
                - literal: 'TRUE'
              - op: eq
                args:
                - select: degradation_owner
                - literal: F2
            then:
              op: min
              args:
              - select: path_component_score
              - literal: 2
          - when:
              op: and
              args:
              - op: eq
                args:
                - select: criticality
                - literal: MATERIAL
              - op: eq
                args:
                - select: service
                - literal: DEGRADED
              - op: eq
                args:
                - select: viability
                - literal: 'TRUE'
              - op: in
                args:
                - select: degradation_owner
                - literal:
                  - F1
                  - F3
                  - F4
                  - F5
                  - PROJECT_READINESS
            then:
              select: path_component_score
          otherwise: null
          local_input_types:
            degradation_owner:
              type: enum
              enum_ref: '#/owner_filtering/owner_enum'
              binding: CONFIRMED_QUALIFIED_PRIMARY_OWNER_OF_SELECTED_PATH_DEGRADATION_CAUSE
            path_component_score:
              type: score_or_null
              producer_rule_ref: '#/criteria/F2/rules/F2_PATH_MIN_v2.0'
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F2/rules/F2_PATH_MIN_v2.0'
      F2_TOPOLOGY_v2.0:
        rule_id: F2_TOPOLOGY_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11.4
        kind: ENUM_MAPPING
        input_refs:
        - '#/criteria/F2/inputs'
        precondition_refs: []
        definition:
          operator: enum_lookup
          input:
            select: integration_topology_complexity
          mapping:
            SIMPLE: 5
            LIMITED_MULTI_SYSTEM: 4
            COORDINATED_MULTI_SYSTEM: 3
            COMPLEX_ORCHESTRATION: 2
            UNMANAGEABLE_IN_CURRENT_SCOPE: 1
            UNKNOWN: null
          requires_positive_qualification: true
          unqualified_or_missing: null
          invalid_enum: null
          affecting_conflict: null
        output:
          type: score_or_null
        dependency_refs: []
      F2_INTERACTIONS_MIN_v2.0:
        rule_id: F2_INTERACTIONS_MIN_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11.4
        kind: AGGREGATION
        input_refs:
        - '#/criteria/F2/inputs'
        precondition_refs: []
        definition:
          operator: strict_min
          inputs:
          - select: included_interaction_scores
          - select: topology_score
          mandatory_complete_set: true
          on_unknown_or_conflict: null
          on_empty: null
          retain_all_ties: true
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F2/rules/F2_PATH_MIN_v2.0'
        - '#/criteria/F2/rules/F2_MATERIAL_DEGRADED_PATH_v2.0'
        - '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0'
        - '#/criteria/F2/rules/F2_TOPOLOGY_v2.0'
        - '#/derivations/rules/DERIVE_F2_TOPOLOGY_v2.0'
        - '#/aggregation/rules/COMMON_STRICT_MIN_v2.0'
      F2_INTEGRATION_COMPLEXITY_v2.0:
        rule_id: F2_INTEGRATION_COMPLEXITY_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11
        kind: GATE
        input_refs:
        - '#/criteria/F2/inputs'
        precondition_refs:
        - '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
        - '#/evidence_policy/rules/COMMON_CONFLICT_NULL_v2.0'
        - '#/owner_filtering/rules/COMMON_OWNER_FILTER_v2.0'
        definition:
          operator: ordered_decision_table
          gate_rule_ref: '#/criteria/F2/rules/F2_REQUIREMENT_GATE_v2.0'
          rows:
          - when:
              op: is_null
              args:
              - select: gate_result
            then: null
          - when:
              op: eq
              args:
              - select: gate_result
              - literal: 5
            then:
              literal: 5
          - when:
              op: or
              args:
              - op: eq
                args:
                - select: incomplete_required_integrations
                - literal: true
              - op: eq
                args:
                - select: unknown_criticality
                - literal: true
              - op: eq
                args:
                - select: inconsistent_path_state
                - literal: true
            then: null
          interaction_branches:
          - when:
              predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/selected_full_viable'
            result_rule_ref: '#/criteria/F2/rules/F2_PATH_MIN_v2.0'
            bindings:
              interface_score:
                select: component_scores.0
              format_score:
                select: component_scores.1
              adapter_score:
                select: component_scores.2
              reliability_score:
                select: component_scores.3
          - when:
              predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/material_selected_degraded_viable'
            result_rule_ref: '#/criteria/F2/rules/F2_MATERIAL_DEGRADED_PATH_v2.0'
            bindings:
              criticality:
                select: interaction.criticality
              service:
                select: selected_path.service
              viability:
                select: selected_path.viability
              degradation_owner:
                select: selected_path.degradation_owner
              path_component_score:
                rule_ref: '#/criteria/F2/rules/F2_PATH_MIN_v2.0'
                bindings:
                  interface_score:
                    select: component_scores.0
                  format_score:
                    select: component_scores.1
                  adapter_score:
                    select: component_scores.2
                  reliability_score:
                    select: component_scores.3
              mandatory_path_component_unknown:
                op: not
                args:
                - predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/mandatory_components_known'
          - when:
              predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/material_no_viable_full_or_degraded'
            result: null
            reason: INCONSISTENT_INTERACTION_CRITICALITY
          - when:
              predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/critical_full_and_substitute_absence_proven'
            result_rule_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0'
            bindings:
              interaction:
                select: interaction
              review:
                select: review
              own_cause:
                select: own_cause
          - when:
              predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/critical_only_degraded_review_unknown'
            result: null
          otherwise_rule_ref: '#/criteria/F2/rules/F2_INTERACTIONS_MIN_v2.0'
          unknown_required: null
          inconsistent_viability_mandatory_property:
            result: null
            reason: INCONSISTENT_PATH_STATE
          mandatory_unknown_cannot_be_numeric: true
          local_input_types:
            interaction:
              type_ref: '#/methodology/type_catalog/IntegrationRequirement'
              qualification_required: true
            selected_path:
              type: nullable_effective_path
              type_ref: '#/methodology/type_catalog/IntegrationPath'
              producer_rule_ref: '#/criteria/F2/rules/F2_PATH_SELECTION_v2.0'
              qualification_required: true
            component_scores:
              type: list<score_or_null>
              ordered_components:
              - interface
              - format
              - adapter
              - reliability
              producer_rule_refs:
              - '#/criteria/F2/rules/F2_INTERFACE_v2.0'
              - '#/criteria/F2/rules/F2_FORMAT_v2.0'
              - '#/criteria/F2/rules/F2_ADAPTER_v2.0'
              - '#/criteria/F2/rules/F2_RELIABILITY_v2.0'
            review:
              type_ref: '#/methodology/type_catalog/AlternativeReview'
              qualification_required: true
              qualified_boolean_propositions:
              - no_viable_full_path
              - no_viable_degraded_path
              - no_viable_substitute
            own_cause:
              type_ref: '#/owner_filtering/cause_requirements'
              confirmation_and_context_qualification_required: true
          local_predicates:
            interaction_included:
              type: truth
              expression:
                op: and
                args:
                - op: all_eligible
                  args:
                  - select: interaction
                  policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                  purpose: NORMAL
                  input_type_ref: '#/methodology/type_catalog/IntegrationRequirement'
                - op: in
                  args:
                  - select: interaction.criticality
                  - literal:
                    - CRITICAL
                    - MATERIAL
            effective_selected_path_qualified:
              type: truth
              expression:
                op: and
                args:
                - op: not
                  args:
                  - op: is_null
                    args:
                    - select: selected_path
                - op: all_eligible
                  args:
                  - select: selected_path
                  policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                  purpose: NORMAL
                  input_type_ref: '#/methodology/type_catalog/IntegrationPath'
            mandatory_components_known:
              type: truth
              expression:
                op: and
                args:
                - op: eq
                  args:
                  - op: count
                    args:
                    - select: component_scores
                  - literal: 4
                - op: eq
                  args:
                  - op: count
                    args:
                    - op: filter
                      args:
                      - select: component_scores
                      - op: is_numeric
                        args:
                        - select: item
                        minimum: 1
                        maximum: 5
                        integer: true
                        finite: true
                        boolean_is_number: false
                      bind: item
                  - literal: 4
            selected_full_viable:
              type: truth
              expression:
                op: and
                args:
                - predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/interaction_included'
                - predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/effective_selected_path_qualified'
                - op: eq
                  args:
                  - select: selected_path.service
                  - literal: FULL
                - op: eq
                  args:
                  - select: selected_path.viability
                  - literal: 'TRUE'
                - op: eq
                  args:
                  - select: selected_path.technical_mechanism_status
                  - literal: AVAILABLE
                - predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/mandatory_components_known'
            material_selected_degraded_viable:
              type: truth
              expression:
                op: and
                args:
                - predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/interaction_included'
                - op: eq
                  args:
                  - select: interaction.criticality
                  - literal: MATERIAL
                - predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/effective_selected_path_qualified'
                - op: eq
                  args:
                  - select: selected_path.service
                  - literal: DEGRADED
                - op: eq
                  args:
                  - select: selected_path.viability
                  - literal: 'TRUE'
                - op: eq
                  args:
                  - select: selected_path.technical_mechanism_status
                  - literal: AVAILABLE
                - predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/mandatory_components_known'
            material_no_viable_full_or_degraded:
              type: truth
              expression:
                op: and
                args:
                - predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/interaction_included'
                - op: eq
                  args:
                  - select: interaction.criticality
                  - literal: MATERIAL
                - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/complete_full_substitute_review'
                - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/no_viable_full_path'
                - op: all_eligible
                  args:
                  - select: review.no_viable_degraded_path
                  policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                  purpose: NORMAL
                  input_type_ref: '#/methodology/type_catalog/Fact'
                - op: eq
                  args:
                  - select: review.no_viable_degraded_path.status
                  - literal: Confirmed
                - op: eq
                  args:
                  - select: review.no_viable_degraded_path.value
                  - literal: true
            critical_full_and_substitute_absence_proven:
              type: truth
              expression:
                op: and
                args:
                - predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/interaction_included'
                - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/critical_interaction'
                - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/no_viable_full_path'
                - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/complete_full_substitute_review'
                - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/no_viable_substitute'
                - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/own_technical_cause_F2'
            critical_only_degraded_review_unknown:
              type: truth
              expression:
                op: and
                args:
                - predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/interaction_included'
                - op: eq
                  args:
                  - select: interaction.criticality
                  - literal: CRITICAL
                - predicate_ref: '#/criteria/F2/rules/F2_INTEGRATION_COMPLEXITY_v2.0/definition/local_predicates/effective_selected_path_qualified'
                - op: eq
                  args:
                  - select: selected_path.service
                  - literal: DEGRADED
                - op: or
                  args:
                  - op: is_null
                    args:
                    - select: review
                  - op: not
                    args:
                    - predicate_ref: '#/criteria/F2/rules/F2_CRITICAL_NO_MECHANISM_v2.0/definition/local_predicates/complete_full_substitute_review'
                  - op: eq
                    args:
                    - select: review.completeness
                    - literal: UNKNOWN
          interaction_branch_order: FIRST_TRUE_WINS
          interaction_otherwise: null
          interaction_input_collection_ref: '#/criteria/F2/inputs/required_integrations'
          interaction_result_collection: included_interaction_scores
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F2/rules/F2_REQUIREMENT_GATE_v2.0'
        - '#/criteria/F2/rules/F2_PATH_SELECTION_v2.0'
        - '#/criteria/F2/rules/F2_INTERACTIONS_MIN_v2.0'
