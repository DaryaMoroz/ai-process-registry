        kind: ENUM_MAPPING
        input_refs:
        - '#/criteria/F3/inputs'
        precondition_refs: []
        definition:
          operator: enum_lookup
          input:
            select: solution_pattern_maturity
          mapping:
            STANDARD_PROVEN: 5
            PROVEN_IN_COMPARABLE_CONTEXT: 4
            ESTABLISHED_REQUIRING_MATERIAL_ADAPTATION: 3
            EXPERIMENTAL_BUT_TECHNICALLY_GROUNDED: 2
            RESEARCH_GRADE_OR_NO_ESTABLISHED_METHOD: 1
            UNKNOWN: null
          requires_positive_qualification: true
          unqualified_or_missing: null
          invalid_enum: null
          affecting_conflict: null
          positive_evidence_by_level:
            STANDARD_PROVEN:
            - standard_proven_approach
            PROVEN_IN_COMPARABLE_CONTEXT:
            - implementation_evidence
            - comparability_proven
            ESTABLISHED_REQUIRING_MATERIAL_ADAPTATION:
            - established_method
            - specific_material_adaptation_defined
            EXPERIMENTAL_BUT_TECHNICALLY_GROUNDED:
            - experimental_approach
            - technical_grounding
            RESEARCH_GRADE_OR_NO_ESTABLISHED_METHOD:
            - confirmed_research_nature_or_absence_of_established_method
        output:
          type: score_or_null
        dependency_refs: []
