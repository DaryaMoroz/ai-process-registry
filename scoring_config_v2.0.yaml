  normal_branch:
    applicability: APPLIES
    validity: VALID_FOR_CONTEXT
    truth_confirmation_required: true
    sufficient_evidence_required: true
    affecting_conflict_allowed: false
  exclusion_allowlist:
  - subject_type: F1_READINESS_DIMENSION
    rule_ref: '#/derivations/rules/DERIVE_F1_READINESS_v2.0'
    applicability: CONFIRMED_NOT_APPLICABLE
    validity: VALID_FOR_CONTEXT
    positive_evidence_required: true
    outcome: EXCLUDE_ITEM_WITHOUT_SCORE
  - subject_type: F3_COMPARABILITY_DIMENSION
    rule_ref: '#/criteria/F3/rules/F3_COMPARABILITY_v2.0'
    applicability: CONFIRMED_NOT_APPLICABLE
    validity: VALID_FOR_CONTEXT
    positive_evidence_required: true
    outcome: EXCLUDE_ITEM_WITHOUT_SCORE
  - subject_type: F4_DOMAIN
    rule_ref: '#/criteria/F4/rules/F4_DOMAIN_REVIEW_v2.0'
    applicability: CONFIRMED_NOT_APPLICABLE
    validity: VALID_FOR_CONTEXT
    positive_evidence_required: true
    outcome: EXCLUDE_ITEM_WITHOUT_SCORE
  invalid_states:
  - UNKNOWN
  - REVALIDATION_REQUIRED
  - INVALID_FOR_CONTEXT
  rules:
    EVIDENCE_CONTEXT_ELIGIBILITY_v2.0:
      rule_id: EVIDENCE_CONTEXT_ELIGIBILITY_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§5–7
      kind: POLICY
      input_refs:
      - '#/applicability_policy/normal_branch'
      - '#/applicability_policy/exclusion_allowlist'
      precondition_refs: []
      definition:
        operator: ordered_decision_table
        first_true_wins: true
        unknown_condition: continue_without_treating_as_false_evidence
        rows:
        - when:
            op: and
            args:
            - op: eq
              args:
              - select: purpose
              - literal: NORMAL
            - op: eq
              args:
              - select: applicability
              - literal: APPLIES
            - op: eq
              args:
              - select: validity
              - literal: VALID_FOR_CONTEXT
          then:
            literal: NORMAL_ELIGIBLE
        - when:
            op: and
            args:
            - op: eq
              args:
              - select: purpose
              - literal: EXCLUSION
            - op: eq
              args:
              - select: explicit_rule_allowlisted
              - literal: true
            - op: eq
              args:
              - select: applicability
              - literal: CONFIRMED_NOT_APPLICABLE
            - op: eq
              args:
              - select: validity
              - literal: VALID_FOR_CONTEXT
          then:
            literal: EXCLUSION_ELIGIBLE
        otherwise:
          literal: INELIGIBLE
      output:
        type: eligibility_branch
      dependency_refs: []
