        kind: GATE
        input_refs:
        - '#/criteria/F3/inputs'
        precondition_refs: []
        definition:
          operator: all
          required_predicates:
          - absence_business_scope_confirmed
          - absence_profile_dependency_confirmed
          - sufficient_scope_context
          - absence_technical_uncertainty_confirmed
          true_outcome: 5
          otherwise: null
          empty_requirements_is_evidence: false
        output:
          type: score_or_null
        dependency_refs:
        - '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
        - '#/evidence_policy/rules/COMMON_CONFLICT_NULL_v2.0'
