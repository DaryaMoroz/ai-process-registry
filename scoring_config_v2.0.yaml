  screening:
    rules:
      SCREENING_TRIAGE_v2.0:
        rule_id: SCREENING_TRIAGE_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§9.2
        kind: SELECTION
        input_refs:
        - '#/methodology/type_catalog/RuleEvaluationContext'
        precondition_refs: []
        definition:
          operator: ordered_decision_table
          first_true_wins: true
          unknown_condition: continue_without_treating_as_false_evidence
          rows:
          - when:
              op: or
              args:
              - op: is_null
                args:
                - select: V1
              - op: is_null
                args:
                - select: V2
            then:
              literal: Insufficient Data
          - when:
              op: in
              args:
              - select: V2
              - literal:
                - 4
                - 5
            then:
              literal: Priority A
          - when:
              op: and
              args:
              - op: eq
                args:
                - select: V2
                - literal: 3
              - op: in
                args:
                - select: V1
                - literal:
                  - 4
                  - 5
            then:
              literal: Priority B
          otherwise:
            literal: OTHER
        output:
          type: screening_category
        dependency_refs:
        - '#/criteria/V1/rules/V1_FREQUENCY_v2.0'
        - '#/criteria/V2/rules/V2_LABOR_v2.0'
    input_criteria:
    - V1
    - V2
    excluded_criteria:
    - V3
    - V4
    - V5
    eligible_row_type: PROCESS
    source_read_only: true
    formal_value_aggregation: false
    manual_addition_allowed: true
    automatic_human_decision: false
    automatic_shortlist_decision: false
