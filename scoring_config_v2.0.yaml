                - select: item.domain_review_outcome
                - literal: CONSTRAINTS_IDENTIFIED
              bind: item
          - literal: 0
        missing_outcome: null
        conflict_outcome: null
        provenance_requirement_ref: '#/evidence_policy/trace_requirements'
    rule_refs:
    - '#/criteria/F4/rules/F4_DOMAIN_REVIEW_v2.0'
    - '#/criteria/F4/rules/F4_DOMAIN_COMPLETENESS_v2.0'
    - '#/criteria/F4/rules/F4_CONSTRAINT_EFFECT_v2.0'
    - '#/criteria/F4/rules/F4_COMPLIANT_PATH_v2.0'
    - '#/criteria/F4/rules/F4_COMPLETE_REVIEW_NO_MATERIAL_CONSTRAINT_v2.0'
    - '#/criteria/F4/rules/F4_CONSTRAINTS_MIN_v2.0'
    - '#/criteria/F4/rules/F4_REGULATORY_ORGANIZATIONAL_CONSTRAINTS_v2.0'
    rules:
      F4_DOMAIN_REVIEW_v2.0:
        rule_id: F4_DOMAIN_REVIEW_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§13.1
        kind: COMPLETENESS
        input_refs:
        - '#/methodology/type_catalog/ConstraintDomainReview'
        precondition_refs: []
        definition:
          operator: all
          required_core_domains:
          - LEGAL_REGULATORY
          - INFORMATION_SECURITY
          - PERSONAL_DATA
          - MANDATORY_HUMAN_ROLE
          - MANDATORY_PROCESS_RULES
          - EXTERNAL_PARTIES
          - AUTHORITY_AND_MANDATE
          core_cardinality_each: 1
          additional_confirmed_relevant_included: true
          exclusion_ref: '#/applicability_policy/exclusion_allowlist/2'
          complete_evidence:
          - reviewed_scope
          - applicable_current_sources
          - relevant_obligations
          - review_item_dispositions
          unsupported_candidate_alone_blocks_complete: false
          evidence_backed_potentially_relevant_candidate_requires_disposition: true
          resolved_means_absence: false
          legacy_review_shortcut_allowed: false
        output:
          type: review_completeness
        dependency_refs: []
      F4_DOMAIN_COMPLETENESS_v2.0:
        rule_id: F4_DOMAIN_COMPLETENESS_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§13.1
        kind: COMPLETENESS
        input_refs:
        - '#/criteria/F4/inputs'
        precondition_refs: []
        definition:
          operator: all
          required:
          - all_core_entries_present
          - additional_relevant_domains_included
          - applicability_known_or_explicitly_excluded
          - all_applicable_domains_complete
          - relevant_outcomes_known
          - backed_candidates_disposed
          - no_affecting_conflict
          unknown_or_incomplete: null
        output:
          type: complete_or_null
        dependency_refs:
        - '#/criteria/F4/rules/F4_DOMAIN_REVIEW_v2.0'
      F4_CONSTRAINT_EFFECT_v2.0:
        rule_id: F4_CONSTRAINT_EFFECT_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§13.2
        kind: ENUM_MAPPING
        input_refs:
        - '#/criteria/F4/inputs'
        precondition_refs: []
        definition:
          operator: enum_lookup
          input:
            select: effect
          mapping:
            ACCOMMODATED_BY_CURRENT_DESIGN: 5
            MINOR_ADAPTATION_REQUIRED: 4
            MATERIAL_ADAPTATION_OR_SCOPE_LIMITATION: 3
            EXTERNAL_OR_NORMATIVE_CHANGE_REQUIRED: 2
            TARGET_CHANGE_PROHIBITED: 1
            UNKNOWN: null
          requires_positive_qualification: true
          unqualified_or_missing: null
          invalid_enum: null
          affecting_conflict: null
          resolution_aliases:
            ACCOMMODATED_AS_IS: ACCOMMODATED_BY_CURRENT_DESIGN
            MINOR_INTERNAL_ADAPTATION: MINOR_ADAPTATION_REQUIRED
            MATERIAL_INTERNAL_ADAPTATION: MATERIAL_ADAPTATION_OR_SCOPE_LIMITATION
            EXTERNAL_OR_NORMATIVE_CHANGE: EXTERNAL_OR_NORMATIVE_CHANGE_REQUIRED
            NO_COMPLIANT_PATH: TARGET_CHANGE_PROHIBITED
          positive_evidence_by_effect:
            ACCOMMODATED_BY_CURRENT_DESIGN:
            - current_design_compliant
            MINOR_ADAPTATION_REQUIRED:
            - minor_design_adaptation_defined
            MATERIAL_ADAPTATION_OR_SCOPE_LIMITATION:
            - material_internal_adaptation_or_scope_limitation
            - existing_authority
            EXTERNAL_OR_NORMATIVE_CHANGE_REQUIRED:
            - legitimate_special_external_normative_or_mandate_path_confirmed
            TARGET_CHANGE_PROHIBITED:
            - applicable_prohibition
            - complete_preserving_path_review
            - no_preserving_compliant_path
          cost_time_classification: false
        output:
          type: score_or_null
        dependency_refs: []
      F4_COMPLIANT_PATH_v2.0:
        rule_id: F4_COMPLIANT_PATH_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§13.2
        kind: SELECTION
        input_refs:
        - '#/methodology/type_catalog/MandatoryConstraint'
        precondition_refs: []
        definition:
          operator: ordered_decision_table
          rows:
          - when:
              op: eq
              args:
              - select: affecting_preservation_unknown
              - literal: true
            then: null
          - when:
              op: eq
              args:
              - select: selected_preserving_path_qualified
              - literal: true
            then:
              select: selected_path_effect
          - when:
              op: eq
              args:
              - select: all_admissible_paths_same_effect_context_preservation
              - literal: true
            then:
              select: common_effect
          - when:
              op: eq
              args:
              - select: complete_internal_external_review_no_preserving_path
              - literal: true
            then:
              literal: TARGET_CHANGE_PROHIBITED
          otherwise: null
          changes_hypothesis: NOT_VIABLE_FOR_CURRENT_HYPOTHESIS
          routine_approval_penalty: false
          special_route_requires_positive_legitimate_evidence: true
          best_path_automatic_selection: false
        output:
          type: effect_enum_or_null
        dependency_refs: []
      F4_COMPLETE_REVIEW_NO_MATERIAL_CONSTRAINT_v2.0:
        rule_id: F4_COMPLETE_REVIEW_NO_MATERIAL_CONSTRAINT_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§13.3
        kind: GATE
        input_refs:
        - '#/criteria/F4/inputs'
        precondition_refs: []
        definition:
          operator: and
          required_predicates:
          - overall_review_complete
          - all_relevant_domain_outcomes_known
          - no_material_applicable_constraint
          - no_affecting_conflict
          true_outcome: 5
          otherwise: null
          accommodated_constraints_allowed: true
          excluded_domain_is_score: false
          empty_list_is_evidence: false
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F4/rules/F4_DOMAIN_COMPLETENESS_v2.0'
      F4_CONSTRAINTS_MIN_v2.0:
        rule_id: F4_CONSTRAINTS_MIN_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§13.3
        kind: AGGREGATION
        input_refs:
        - '#/criteria/F4/inputs'
        precondition_refs: []
        definition:
          operator: strict_min
          inputs:
          - select: all_applicable_constraint_scores
          mandatory_complete_set: true
          on_unknown_or_conflict: null
          on_empty: null
          retain_all_ties: true
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F4/rules/F4_CONSTRAINT_EFFECT_v2.0'
        - '#/criteria/F4/rules/F4_COMPLIANT_PATH_v2.0'
        - '#/aggregation/rules/COMMON_STRICT_MIN_v2.0'
      F4_REGULATORY_ORGANIZATIONAL_CONSTRAINTS_v2.0:
        rule_id: F4_REGULATORY_ORGANIZATIONAL_CONSTRAINTS_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§13.3
        kind: GATE
        input_refs:
        - '#/criteria/F4/inputs'
        precondition_refs:
        - '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
        - '#/evidence_policy/rules/COMMON_CONFLICT_NULL_v2.0'
        - '#/owner_filtering/rules/COMMON_OWNER_FILTER_v2.0'
        definition:
          operator: ordered_decision_table
          first_true_wins: true
          unknown_condition: continue_without_treating_as_false_evidence
          rows:
          - when:
              op: eq
              args:
              - select: any_required_review_effect_preservation_unknown_or_conflict
              - literal: true
            then: null
          - when:
              op: eq
              args:
              - select: complete_review_without_material_constraint
              - literal: true
            then:
              rule_ref: '#/criteria/F4/rules/F4_COMPLETE_REVIEW_NO_MATERIAL_CONSTRAINT_v2.0'
              bindings: {}
          - when:
              op: eq
              args:
              - select: complete_review_with_material_constraints
              - literal: true
            then:
              rule_ref: '#/criteria/F4/rules/F4_CONSTRAINTS_MIN_v2.0'
              bindings: {}
          otherwise: null
          mandatory_unknown_cannot_be_numeric: true
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F4/rules/F4_DOMAIN_COMPLETENESS_v2.0'
        - '#/criteria/F4/rules/F4_COMPLETE_REVIEW_NO_MATERIAL_CONSTRAINT_v2.0'
        - '#/criteria/F4/rules/F4_CONSTRAINTS_MIN_v2.0'
