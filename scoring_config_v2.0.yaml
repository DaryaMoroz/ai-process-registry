        rule_id: V4_REPEATABILITY_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§9.1
        kind: NUMERIC_MAPPING
        input_refs:
        - '#/criteria/V4/inputs'
        precondition_refs:
        - '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
        - '#/evidence_policy/rules/COMMON_CONFLICT_NULL_v2.0'
        definition:
          operator: ordered_decision_table
          domain:
            type: number
            minimum: 0
            maximum: 100
            finite: true
            unit: percent
          special_branches: []
          ranges:
          - lower: 0
            lower_inclusive: true
            upper: 20
            upper_inclusive: false
            score: 1
          - lower: 20
            lower_inclusive: true
            upper: 40
            upper_inclusive: false
            score: 2
          - lower: 40
            lower_inclusive: true
            upper: 70
            upper_inclusive: false
            score: 3
          - lower: 70
            lower_inclusive: true
            upper: 90
            upper_inclusive: false
            score: 4
          - lower: 90
            lower_inclusive: true
            upper: 100
            upper_inclusive: true
            score: 5
          invalid_or_missing: null
          rounding: FORBIDDEN
          clamping: FORBIDDEN
          qualitative_mapping:
            unique: 1
            mostly_unique: 2
            mixed: 3
            mostly_standard: 4
            standard: 5
          conflict_checked_before_selection: true
          workflow: DEEP_ASSESSMENT_ONLY
          local_input_types:
            facts:
              type: record
              fields:
                standard_scenario_share_percent:
                  input_descriptor_ref: '#/criteria/V4/inputs/standard_scenario_share_percent'
                  nullable: true
                repeatability_level:
                  input_descriptor_ref: '#/criteria/V4/inputs/repeatability_level'
                  nullable: true
                percent_cannot_be_determined:
                  type: qualified_proposition
                  value_type: boolean
                  allowed_statuses:
                  - Confirmed
                  context_ref: '#/methodology/context_requirements/ProcessValueBaseline'
                  policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                  spec_refs:
                  - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§9.1
                  - SCORING_CONFIG_V2_DESIGN.md:0.1:§8.4
                  nullable: true
            affecting_conflict:
              type: boolean
              producer_rule_ref: '#/evidence_policy/rules/COMMON_CONFLICT_NULL_v2.0'
              unknown_selects_branch: false
          local_predicates:
            quantitative_eligible:
              type: truth
              expression:
                op: all_eligible
                args:
                - select: facts.standard_scenario_share_percent
                policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                purpose: NORMAL
                input_descriptor_ref: '#/criteria/V4/inputs/standard_scenario_share_percent'
            percent_cannot_be_determined_confirmed:
              type: truth
              expression:
                op: and
                args:
                - op: all_eligible
                  args:
                  - select: facts.percent_cannot_be_determined
                  policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                  purpose: NORMAL
                  input_type_ref: '#/criteria/V4/rules/V4_REPEATABILITY_v2.0/definition/local_input_types/facts/fields/percent_cannot_be_determined'
                - op: eq
                  args:
                  - select: facts.percent_cannot_be_determined.value
                  - literal: true
            qualitative_eligible:
              type: truth
              expression:
                op: all_eligible
                args:
                - select: facts.repeatability_level
                policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
                purpose: NORMAL
                input_descriptor_ref: '#/criteria/V4/inputs/repeatability_level'
            qualitative_fallback:
              type: truth
              expression:
                op: and
                args:
                - op: not
                  args:
                  - predicate_ref: '#/criteria/V4/rules/V4_REPEATABILITY_v2.0/definition/local_predicates/quantitative_eligible'
                - predicate_ref: '#/criteria/V4/rules/V4_REPEATABILITY_v2.0/definition/local_predicates/percent_cannot_be_determined_confirmed'
                - predicate_ref: '#/criteria/V4/rules/V4_REPEATABILITY_v2.0/definition/local_predicates/qualitative_eligible'
          first_true_wins: true
          rows:
          - when:
              op: eq
              args:
              - select: affecting_conflict
              - literal: true
            then: null
          - when:
              op: and
              args:
              - op: eq
                args:
                - select: affecting_conflict
                - literal: false
              - predicate_ref: '#/criteria/V4/rules/V4_REPEATABILITY_v2.0/definition/local_predicates/quantitative_eligible'
            then:
              operator: numeric_ranges
              input:
                select: facts.standard_scenario_share_percent.value
              ranges_ref: '#/criteria/V4/rules/V4_REPEATABILITY_v2.0/definition/ranges'
              domain_ref: '#/criteria/V4/rules/V4_REPEATABILITY_v2.0/definition/domain'
              invalid_or_missing: null
          - when:
              op: and
              args:
              - op: eq
                args:
                - select: affecting_conflict
                - literal: false
              - predicate_ref: '#/criteria/V4/rules/V4_REPEATABILITY_v2.0/definition/local_predicates/qualitative_fallback'
            then:
              operator: enum_lookup
              input:
                select: facts.repeatability_level.value
              mapping_ref: '#/criteria/V4/rules/V4_REPEATABILITY_v2.0/definition/qualitative_mapping'
              invalid_or_missing: null
          otherwise: null
          selection_result_types:
            numeric_branch: score_or_null
            qualitative_branch: score_or_null
        output:
          type: score_or_null
        dependency_refs: []
