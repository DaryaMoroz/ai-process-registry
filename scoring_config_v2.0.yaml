          - CONFIRMED_NOT_REQUIRED
          - UNKNOWN
        allowed_statuses:
        - Confirmed
        source_policy_ref: '#/evidence_policy/fact_requirements'
        confirmation_policy_requirement_ref: '#/confirmation_policy/policy_requirements'
        context_ref: '#/methodology/context_requirements/HypothesisAssessment'
        applicability_branch_ref: '#/applicability_policy/normal_branch'
        required_when:
          literal: true
        missing_outcome: null
        conflict_outcome: null
        provenance_requirement_ref: '#/evidence_policy/trace_requirements'
      required_data_requirement_groups:
        fact_id: required_data_requirement_groups
        type_ref: '#/methodology/type_catalog/Collection'
        unit: not_applicable
        domain:
          type: collection
        allowed_statuses:
        - Confirmed
        source_policy_ref: '#/evidence_policy/fact_requirements'
        confirmation_policy_requirement_ref: '#/confirmation_policy/policy_requirements'
        context_ref: '#/methodology/context_requirements/HypothesisAssessment'
        applicability_branch_ref: '#/applicability_policy/normal_branch'
        required_when:
          op: eq
          args:
          - select: data_requirement_status
          - literal: REQUIRED
        missing_outcome: null
        conflict_outcome: null
        provenance_requirement_ref: '#/evidence_policy/trace_requirements'
      selected_sourcing_plans:
        fact_id: selected_sourcing_plans
        type_ref: '#/methodology/type_catalog/Collection'
        unit: not_applicable
        domain:
          type: collection
        allowed_statuses:
        - Confirmed
        source_policy_ref: '#/evidence_policy/fact_requirements'
        confirmation_policy_requirement_ref: '#/confirmation_policy/policy_requirements'
        context_ref: '#/methodology/context_requirements/HypothesisAssessment'
        applicability_branch_ref: '#/applicability_policy/normal_branch'
        required_when:
          op: eq
          args:
          - select: data_requirement_status
          - literal: REQUIRED
        missing_outcome: null
        conflict_outcome: null
        provenance_requirement_ref: '#/evidence_policy/trace_requirements'
      critical_analysis:
        fact_id: critical_analysis
        type_ref: '#/methodology/type_catalog/Fact'
        unit: not_applicable
        domain:
          type: qualified_record
        allowed_statuses:
        - Confirmed
        source_policy_ref: '#/evidence_policy/fact_requirements'
        confirmation_policy_requirement_ref: '#/confirmation_policy/policy_requirements'
        context_ref: '#/methodology/context_requirements/HypothesisAssessment'
        applicability_branch_ref: '#/applicability_policy/normal_branch'
        required_when:
          op: and
          args:
          - op: eq
            args:
            - select: data_requirement_status
            - literal: REQUIRED
          - op: eq
            args:
            - select: context.critical_analysis_can_affect_result
            - literal: true
        missing_outcome: null
        conflict_outcome: null
        provenance_requirement_ref: '#/evidence_policy/trace_requirements'
    rule_refs:
    - '#/criteria/F1/rules/F1_CONFIRMED_NOT_REQUIRED_v2.0'
    - '#/criteria/F1/rules/F1_REQUIREMENT_GATE_v2.0'
    - '#/criteria/F1/rules/F1_SOURCING_PLAN_v2.0'
    - '#/criteria/F1/rules/F1_REQUIREMENT_GROUP_COVERAGE_v2.0'
    - '#/criteria/F1/rules/F1_COVERAGE_v2.0'
    - '#/criteria/F1/rules/F1_RESOURCE_ACCESS_v2.0'
    - '#/criteria/F1/rules/F1_GROUP_ACCESS_MIN_v2.0'
    - '#/criteria/F1/rules/F1_READINESS_v2.0'
    - '#/criteria/F1/rules/F1_CRITICAL_DATA_OVERRIDE_v2.0'
    - '#/criteria/F1/rules/F1_COMPONENT_MIN_v2.0'
    - '#/criteria/F1/rules/F1_DATA_AVAILABILITY_READINESS_v2.0'
    rules:
      F1_CONFIRMED_NOT_REQUIRED_v2.0:
        rule_id: F1_CONFIRMED_NOT_REQUIRED_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§10
        kind: GATE
        input_refs:
        - '#/criteria/F1/inputs'
        precondition_refs: []
        definition:
          operator: all
          required_predicates:
          - absence_business_scope_confirmed
          - absence_profile_dependency_confirmed
          - sufficient_scope_context
          true_outcome: 5
          otherwise: null
          empty_requirements_is_evidence: false
        output:
          type: score_or_null
        dependency_refs:
        - '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
        - '#/evidence_policy/rules/COMMON_CONFLICT_NULL_v2.0'
        - '#/owner_filtering/rules/COMMON_OWNER_FILTER_v2.0'
      F1_REQUIREMENT_GATE_v2.0:
        rule_id: F1_REQUIREMENT_GATE_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§10
        kind: GATE
        input_refs:
        - '#/criteria/F1/inputs'
        precondition_refs: []
        definition:
          operator: ordered_decision_table
          first_true_wins: true
          unknown_condition: continue_without_treating_as_false_evidence
          rows:
          - when:
              op: eq
              args:
              - select: data_requirement_status
              - literal: CONFIRMED_NOT_REQUIRED
            then:
              rule_ref: '#/criteria/F1/rules/F1_CONFIRMED_NOT_REQUIRED_v2.0'
              bindings: {}
          - when:
              op: eq
              args:
              - select: data_requirement_status
              - literal: REQUIRED
            then:
              literal: EVALUATE_REQUIRED
          otherwise: null
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F1/rules/F1_CONFIRMED_NOT_REQUIRED_v2.0'
      F1_SOURCING_PLAN_v2.0:
        rule_id: F1_SOURCING_PLAN_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§10
        kind: SELECTION
        input_refs:
        - '#/methodology/type_catalog/SourcingPlan'
        precondition_refs: []
        definition:
          operator: all
          required:
          - selected_plan_defined
          - resulting_required_groups_defined
          - joint_bindings_complete
          - sourcing_units_complete
          unselected_alternatives: TRACE_AND_REVIEW_ONLY
          on_unknown: null
          plan_change: NEW_SNAPSHOT_RECALCULATION
          requirement_meaning_change: NEW_HYPOTHESIS_SCOPE_VERSION
        output:
          type: selected_group_set_or_null
        dependency_refs: []
      F1_REQUIREMENT_GROUP_COVERAGE_v2.0:
        rule_id: F1_REQUIREMENT_GROUP_COVERAGE_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§10
        kind: DERIVATION
        input_refs:
        - '#/methodology/type_catalog/DataRequirementGroup'
        precondition_refs: []
        definition:
          operator: record
          required:
          - complete_required_groups
          - homogeneous_basis
          - all_score_relevant_unit_states_known
          - eligible_basis_evidence
          - counts_consistent_with_units
          valid_count_condition:
            op: and
            args:
            - op: gt
              args:
              - select: total_required_units
              - literal: 0
            - op: ge
              args:
              - select: covered_required_units
              - literal: 0
            - op: le
              args:
              - select: covered_required_units
              - select: total_required_units
          group_expression:
            op: multiply
            args:
            - op: divide
              args:
              - select: covered_required_units
              - select: total_required_units
            - literal: 100
          overall_expression:
            op: strict_min
            args:
            - select: group_percentages
          invalid_unknown_or_empty: null
          pooled_group_percentage: false
        output:
          type: percent_or_null
        dependency_refs:
        - '#/criteria/F1/rules/F1_SOURCING_PLAN_v2.0'
      F1_COVERAGE_v2.0:
        rule_id: F1_COVERAGE_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§10.2
        kind: NUMERIC_MAPPING
        input_refs:
        - '#/criteria/F1/inputs'
        precondition_refs: []
        definition:
          operator: numeric_ranges
          input:
            select: required_data_coverage_percent
          domain:
            type: number
            minimum: 0
            maximum: 100
            finite: true
            unit: percent
          special_branches: []
          ranges:
          - lower: 0
            lower_inclusive: true
            upper: 20
            upper_inclusive: false
            score: 1
          - lower: 20
            lower_inclusive: true
            upper: 40
            upper_inclusive: false
            score: 2
          - lower: 40
            lower_inclusive: true
            upper: 70
            upper_inclusive: false
            score: 3
          - lower: 70
            lower_inclusive: true
            upper: 90
            upper_inclusive: false
            score: 4
          - lower: 90
            lower_inclusive: true
            upper: 100
            upper_inclusive: true
            score: 5
          invalid_or_missing: null
          rounding: FORBIDDEN
          clamping: FORBIDDEN
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F1/rules/F1_REQUIREMENT_GROUP_COVERAGE_v2.0'
      F1_RESOURCE_ACCESS_v2.0:
        rule_id: F1_RESOURCE_ACCESS_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§10.3
        kind: ENUM_MAPPING
        input_refs:
        - '#/criteria/F1/inputs'
        precondition_refs: []
        definition:
          operator: enum_lookup
          input:
            select: data_resource_access_level
          mapping:
            ROUTINELY_AVAILABLE: 5
            AVAILABLE_WITH_STANDARD_RETRIEVAL: 4
            MATERIALLY_CONSTRAINED_ACCESS: 3
            EXCEPTIONAL_OR_LIMITED_ACCESS: 2
            CONFIRMED_UNAVAILABLE: 1
            UNKNOWN: null
          requires_positive_qualification: true
          unqualified_or_missing: null
          invalid_enum: null
          affecting_conflict: null
          positive_evidence_fields:
          - source_owner
          - required_resource
          - verified_retrieval_method
          - retrieval_conditions
          permission_project_token_mechanism_are_own_inputs: false
        output:
          type: score_or_null
        dependency_refs: []
      F1_GROUP_ACCESS_MIN_v2.0:
        rule_id: F1_GROUP_ACCESS_MIN_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§10.3
        kind: AGGREGATION
        input_refs:
        - '#/criteria/F1/inputs'
        precondition_refs: []
        definition:
          operator: strict_min
          inputs:
          - select: selected_resulting_group_access_scores
          mandatory_complete_set: true
          on_unknown_or_conflict: null
          on_empty: null
          retain_all_ties: true
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F1/rules/F1_SOURCING_PLAN_v2.0'
        - '#/criteria/F1/rules/F1_RESOURCE_ACCESS_v2.0'
        - '#/aggregation/rules/COMMON_STRICT_MIN_v2.0'
      F1_READINESS_v2.0:
        rule_id: F1_READINESS_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§10.4
        kind: ENUM_MAPPING
        input_refs:
        - '#/criteria/F1/inputs'
        precondition_refs: []
        definition:
          operator: enum_lookup
          input:
            select: data_readiness_level
          mapping:
            READY: 5
            MINOR_PREPARATION: 4
            MODERATE_PREPARATION: 3
            MAJOR_PREPARATION: 2
            UNUSABLE: 1
            UNKNOWN: null
          requires_positive_qualification: true
          unqualified_or_missing: null
          invalid_enum: null
          affecting_conflict: null
        output:
          type: score_or_null
        dependency_refs: []
      F1_CRITICAL_DATA_OVERRIDE_v2.0:
        rule_id: F1_CRITICAL_DATA_OVERRIDE_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§10.5
        kind: PREDICATE
        input_refs:
        - '#/criteria/F1/inputs'
        precondition_refs: []
        definition:
          operator: and
          required_predicates:
          - gate_required
          - critical_requirement
          - objective_resource_unavailable
          - own_cause_F1
          - complete_substitute_remediation_review
          - no_viable_substitute
          on_all_true: 'TRUE'
          on_eligible_disproof: 'FALSE'
          otherwise: UNKNOWN
          mandatory_component_unknown_bypass: false
        output:
          type: truth
        dependency_refs:
        - '#/owner_filtering/rules/COMMON_OWNER_FILTER_v2.0'
        - '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
      F1_COMPONENT_MIN_v2.0:
        rule_id: F1_COMPONENT_MIN_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§10.5
        kind: AGGREGATION
        input_refs:
        - '#/criteria/F1/inputs'
        precondition_refs: []
        definition:
          operator: strict_min
          inputs:
          - select: coverage_score
          - select: access_score
          - select: readiness_score
          mandatory_complete_set: true
          on_unknown_or_conflict: null
          on_empty: null
          retain_all_ties: true
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F1/rules/F1_COVERAGE_v2.0'
        - '#/criteria/F1/rules/F1_GROUP_ACCESS_MIN_v2.0'
        - '#/derivations/rules/DERIVE_F1_READINESS_v2.0'
        - '#/aggregation/rules/COMMON_STRICT_MIN_v2.0'
      F1_DATA_AVAILABILITY_READINESS_v2.0:
        rule_id: F1_DATA_AVAILABILITY_READINESS_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§10.5
        kind: GATE
        input_refs:
        - '#/criteria/F1/inputs'
        precondition_refs:
        - '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
        - '#/evidence_policy/rules/COMMON_CONFLICT_NULL_v2.0'
        - '#/owner_filtering/rules/COMMON_OWNER_FILTER_v2.0'
        definition:
          operator: ordered_decision_table
          first_true_wins: true
          unknown_condition: continue_without_treating_as_false_evidence
          rows:
          - when:
              op: is_null
              args:
              - select: gate_result
            then: null
          - when:
              op: eq
              args:
              - select: affecting_conflict
              - literal: true
            then: null
          - when:
              op: eq
              args:
              - select: gate_result
              - literal: 5
            then:
              literal: 5
          - when:
              op: any
              args:
              - select: mandatory_component_unknowns
            then: null
          - when:
              op: eq
              args:
              - select: critical_analysis_unknown_can_change_result
              - literal: true
            then: null
          - when:
              op: eq
              args:
              - select: critical_predicate
              - literal: 'TRUE'
            then:
              literal: 1
          - when:
              op: and
              args:
              - op: eq
                args:
                - select: all_three_components_known
                - literal: true
              - op: eq
                args:
                - select: critical_analysis_complete
                - literal: true
            then:
              rule_ref: '#/criteria/F1/rules/F1_COMPONENT_MIN_v2.0'
              bindings: {}
          otherwise: null
          mandatory_unknown_cannot_be_numeric: true
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F1/rules/F1_REQUIREMENT_GATE_v2.0'
        - '#/criteria/F1/rules/F1_COMPONENT_MIN_v2.0'
        - '#/criteria/F1/rules/F1_CRITICAL_DATA_OVERRIDE_v2.0'
