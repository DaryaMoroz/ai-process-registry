              - literal: REQUIRED
            then:
              literal: EVALUATE_REQUIRED
          otherwise: null
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F3/rules/F3_CONFIRMED_NOT_REQUIRED_v2.0'
