        precondition_refs: []
        definition:
          operator: all
          collectable_before_change_required:
          - source
          - method
          - scope
          - population
          - period
          - units
          - responsible_source_owner
          - confirmed_ability_to_collect_before_process_change
          exposure_enum:
          - NOT_STARTED
          - STARTED
          - UNKNOWN
          exposure_started_requires: start_time
          baseline_precedes: MATERIAL_EXPOSURE_OF_MEASURED_SCOPE
          development_start_is_exposure: false
          unknown_affecting_boundary: null
          post_exposure_collection_promise_is_baseline: false
          reconstruction_required:
          - source_window
          - method
          - assumptions
          - validation_reconciliation
          - scope_population_fit
          - exposure_boundary
          limited_proxy_requires: confirmed_fitness
          not_obtainable_requires: positive_impossibility_evidence
          universal_duration_sample_size: null
        output:
          type: baseline_qualification_or_null
        dependency_refs: []
      F5_REQUIRED_SOURCES_v2.0:
        rule_id: F5_REQUIRED_SOURCES_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§14.4
        kind: DERIVATION
        input_refs:
        - '#/criteria/F5/inputs'
        precondition_refs: []
        definition:
          operator: ordered_decision_table
          first_true_wins: true
          unknown_condition: continue_without_treating_as_false_evidence
          rows:
          - when:
              op: eq
              args:
              - select: required_source_set_empty_or_incomplete
              - literal: true
            then: null
          - when:
              op: eq
              args:
              - select: score_relevant_required_source_unknown
              - literal: true
            then: null
          - when:
              op: eq
              args:
              - select: any_required_unavailable
              - literal: true
            then:
              literal: UNAVAILABLE
          - when:
              op: eq
              args:
              - select: any_required_partial
              - literal: true
            then:
              literal: PARTIAL
          - when:
              op: eq
              args:
              - select: any_required_collectable
              - literal: true
            then:
              literal: COLLECTABLE
          - when:
              op: eq
              args:
              - select: all_required_available
              - literal: true
            then:
              literal: AVAILABLE
          otherwise: null
          source_status_enum:
          - AVAILABLE
          - COLLECTABLE
          - PARTIAL
          - UNAVAILABLE
          - UNKNOWN
          include_roles:
          - REQUIRED
          exclude_roles:
          - SUPPORTING
          - ALTERNATIVE_NOT_SELECTED
          collectable_evidence:
          - source
          - collection_method
          - confirmed_ability
          - owner
          - scope
          - population
          - period
          - units
          - design_fitness
          unknown_precedes_unavailable: true
          foreign_penalty_or_default: false
        output:
          type: source_status_or_null
        dependency_refs: []
      F5_SOURCE_LIMIT_v2.0:
        rule_id: F5_SOURCE_LIMIT_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§14.4
        kind: AGGREGATION
        input_refs:
        - '#/criteria/F5/inputs'
        precondition_refs: []
        definition:
          operator: ordered_decision_table
          first_true_wins: true
          unknown_condition: continue_without_treating_as_false_evidence
          rows:
          - when:
              op: is_null
              args:
              - select: base_method_score
            then: null
          - when:
              op: in
              args:
              - select: source_status
              - literal:
                - AVAILABLE
                - COLLECTABLE
            then:
              select: base_method_score
          - when:
              op: eq
              args:
              - select: source_status
              - literal: PARTIAL
            then:
              op: min
              args:
              - select: base_method_score
              - literal: 3
          - when:
              op: eq
              args:
              - select: source_status
              - literal: UNAVAILABLE
            then:
              literal: 1
          otherwise: null
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F5/rules/F5_METHOD_v2.0'
        - '#/criteria/F5/rules/F5_REQUIRED_SOURCES_v2.0'
      F5_JOINT_INDICATORS_v2.0:
        rule_id: F5_JOINT_INDICATORS_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§14.6
        kind: AGGREGATION
        input_refs:
        - '#/criteria/F5/inputs'
        precondition_refs: []
        definition:
          operator: strict_min
          single_sufficient: SELECTED_SUFFICIENT_INDICATOR
          joint_required_componentwise:
          - indicator_score
          - baseline_score
          - method_score
          - comparability_score
          attribution_modes:
          - SHARED_PROVEN_WHOLE_DESIGN
          - INDICATOR_SPECIFIC_STRICT_MIN
          mandatory_unknown_or_empty: null
          unselected_indicators_included: false
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F5/rules/F5_INDICATOR_MIN_v2.0'
        - '#/criteria/F5/rules/F5_BASELINE_v2.0'
        - '#/criteria/F5/rules/F5_SOURCE_LIMIT_v2.0'
        - '#/criteria/F5/rules/F5_COMPARABILITY_v2.0'
        - '#/criteria/F5/rules/F5_ATTRIBUTION_v2.0'
        - '#/criteria/F5/rules/F5_PROXY_QUALIFICATION_v2.0'
        - '#/aggregation/rules/COMMON_STRICT_MIN_v2.0'
      F5_COMPONENT_MIN_v2.0:
        rule_id: F5_COMPONENT_MIN_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§14.6
        kind: AGGREGATION
        input_refs:
        - '#/criteria/F5/inputs'
        precondition_refs: []
        definition:
          operator: strict_min
          inputs:
          - select: indicator_score
          - select: baseline_score
          - select: method_score
          - select: comparability_score
          - select: attribution_score
          mandatory_complete_set: true
          on_unknown_or_conflict: null
          on_empty: null
          retain_all_ties: true
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F5/rules/F5_JOINT_INDICATORS_v2.0'
        - '#/aggregation/rules/COMMON_STRICT_MIN_v2.0'
      F5_DECISION_MATERIAL_EFFECTS_v2.0:
        rule_id: F5_DECISION_MATERIAL_EFFECTS_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§14.6
        kind: AGGREGATION
        input_refs:
        - '#/criteria/F5/inputs'
        precondition_refs: []
        definition:
          operator: strict_min
          collection: effect_F5
          include_roles:
          - PRIMARY
          - ADDITIONAL_DECISION_MATERIAL
          exclude_roles:
          - SECONDARY_CONTEXT
          complete_formal_set_required: true
          unknown_or_empty: null
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F5/rules/F5_COMPONENT_MIN_v2.0'
        - '#/criteria/F5/rules/F5_EFFECT_SET_v2.0'
        - '#/aggregation/rules/COMMON_STRICT_MIN_v2.0'
      F5_EFFECT_MEASURABILITY_v2.0:
        rule_id: F5_EFFECT_MEASURABILITY_v2.0
        spec_refs:
        - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§14
        kind: GATE
        input_refs:
        - '#/criteria/F5/inputs'
        precondition_refs:
        - '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
        - '#/evidence_policy/rules/COMMON_CONFLICT_NULL_v2.0'
        - '#/owner_filtering/rules/COMMON_OWNER_FILTER_v2.0'
        definition:
          operator: ordered_decision_table
          first_true_wins: true
          unknown_condition: continue_without_treating_as_false_evidence
          rows:
          - when:
              op: eq
              args:
              - select: effect_scope_gate_failed_or_unknown
              - literal: true
            then: null
          - when:
              op: eq
              args:
              - select: all_formal_definitions_eligible_complete
              - literal: true
            then:
              rule_ref: '#/criteria/F5/rules/F5_DECISION_MATERIAL_EFFECTS_v2.0'
              bindings: {}
          otherwise: null
          mandatory_unknown_cannot_be_numeric: true
        output:
          type: score_or_null
        dependency_refs:
        - '#/criteria/F5/rules/F5_EFFECT_SCOPE_GATE_v2.0'
        - '#/criteria/F5/rules/F5_DECISION_MATERIAL_EFFECTS_v2.0'
derivations:
  rules:
    DERIVE_ANNUAL_LABOR_HOURS_v2.0:
      rule_id: DERIVE_ANNUAL_LABOR_HOURS_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§9.1
      kind: DERIVATION
      input_refs:
      - '#/criteria/V2/inputs/annual_instances'
      - '#/criteria/V2/inputs/hours_per_instance'
      precondition_refs: []
      definition:
        operator: multiply
        operands:
        - select: annual_instances
        - select: hours_per_instance
        required:
        - eligible_confirmed_operands
        - finite_nonnegative
        - compatible_baseline_units
        on_invalid: null
        output_unit: person_hours_per_year
        output_status: Derived
      output:
        type: number_or_null
      dependency_refs: []
    DERIVE_PROBLEM_PROXY_v2.0:
      rule_id: DERIVE_PROBLEM_PROXY_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§9.1
      kind: DERIVATION
      input_refs:
      - '#/criteria/V5/inputs/return_rate'
      - '#/criteria/V5/inputs/error_rate'
      - '#/criteria/V5/inputs/delay_rate'
      - '#/criteria/V5/inputs/rework_rate'
      - '#/criteria/V5/inputs/complaint_rate'
      precondition_refs: []
      definition:
        operator: max
        collection:
        - return_rate
        - error_rate
        - delay_rate
        - rework_rate
        - complaint_rate
        filter:
          op: all_eligible
          args:
          - select: item
          policy_ref: '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
          purpose: NORMAL
          input_type_ref: '#/derivations/rules/DERIVE_PROBLEM_PROXY_v2.0/definition/filter_input_type'
        minimum_eligible_count: 1
        missing_operand: OMIT_NOT_ZERO
        on_empty_or_affecting_conflict: null
        output_status: Derived
        output_unit: percent
        filter_binding:
          name: item
          type: Confirmed_percent_fact
          input_names:
          - return_rate
          - error_rate
          - delay_rate
          - rework_rate
          - complaint_rate
          descriptor_resolution: MATCH_OPERAND_NAME_TO_EXISTING_INPUT_REF
          unit: percent
          minimum: 0
          maximum: 100
          finite: true
          status: Confirmed
        filter_input_type:
          type: Fact
          value_type: number
          unit: percent
          minimum: 0
          maximum: 100
          finite: true
          allowed_statuses:
          - Confirmed
          context_ref: '#/methodology/context_requirements/ProcessValueBaseline'
      output:
        type: number_or_null
      dependency_refs: []
    DERIVE_F1_READINESS_v2.0:
      rule_id: DERIVE_F1_READINESS_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§10.4
      kind: DERIVATION
      input_refs:
      - '#/methodology/type_catalog/ReadinessDimension'
      precondition_refs: []
      definition:
        operator: strict_min
        dimension_mapping:
          AS_IS_FIT: 5
          MINOR_PREPARATION: 4
          MODERATE_PREPARATION: 3
          MAJOR_PREPARATION: 2
          NOT_REMEDIABLE: 1
          UNKNOWN: null
        item_exclusion_ref: '#/applicability_policy/exclusion_allowlist/0'
        group_aggregation: STRICT_MIN_APPLICABLE_DIMENSIONS
        overall_aggregation: STRICT_MIN_REQUIRED_GROUPS
        all_dimensions_excluded: null
        unknown_score_relevant_applicability_or_state: null
        empty: null
        aggregate_trace_mapping_ref: '#/criteria/F1/rules/F1_READINESS_v2.0'
        freshness_not_fit_requires_preparation_qualification: true
        absent_data_readiness_substitution: false
        output_level_from_score:
          5: READY
          4: MINOR_PREPARATION
          3: MODERATE_PREPARATION
          2: MAJOR_PREPARATION
          1: UNUSABLE
      output:
        type: readiness_level_and_score_or_null
      dependency_refs:
      - '#/criteria/F1/rules/F1_READINESS_v2.0'
      - '#/aggregation/rules/COMMON_STRICT_MIN_v2.0'
      - '#/applicability_policy/rules/EVIDENCE_CONTEXT_ELIGIBILITY_v2.0'
    DERIVE_F2_TOPOLOGY_v2.0:
      rule_id: DERIVE_F2_TOPOLOGY_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§11.4
      kind: DERIVATION
      input_refs:
      - '#/methodology/type_catalog/RuleEvaluationContext'
      precondition_refs: []
      definition:
        operator: ordered_decision_table
        first_true_wins: true
        unknown_condition: continue_without_treating_as_false_evidence
        rows:
        - when:
            op: eq
            args:
            - select: unmanageable_in_scope_confirmed
            - literal: true
          then:
            literal: UNMANAGEABLE_IN_CURRENT_SCOPE
        - when:
            op: eq
            args:
            - select: score_relevant_driver_or_viability_unknown
            - literal: true
          then: null
        - when:
            op: and
            args:
            - op: eq
              args:
              - select: complex_driver_present
              - literal: true
            - op: eq
              args:
              - select: architecture_viable
              - literal: true
          then:
            literal: COMPLEX_ORCHESTRATION
        - when:
            op: and
            args:
            - op: eq
              args:
              - select: bounded_coordination_driver
              - literal: true
            - op: eq
              args:
              - select: no_complex_driver_confirmed
              - literal: true
          then:
            literal: COORDINATED_MULTI_SYSTEM
        - when:
            op: and
            args:
            - op: eq
              args:
              - select: multiple_independent_interactions
              - literal: true
            - op: eq
              args:
              - select: no_coordination_drivers_confirmed
              - literal: true
          then:
            literal: LIMITED_MULTI_SYSTEM
        - when:
            op: and
            args:
            - op: eq
              args:
              - select: one_independent_interaction
              - literal: true
            - op: eq
              args:
              - select: no_coordination_confirmed
              - literal: true
          then:
            literal: SIMPLE
        otherwise: null
        complex_drivers:
        - transactional_consistency
        - cross_failure_coordination
        - central_orchestration
        - cycle
      output:
        type: topology_enum_or_null
      dependency_refs: []
    DERIVE_F3_TARGET_VALIDATION_v2.0:
      rule_id: DERIVE_F3_TARGET_VALIDATION_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§12.6
      kind: DERIVATION
      input_refs:
      - '#/methodology/type_catalog/TechnicalSuccessCriterion'
      precondition_refs: []
      definition:
        operator: ordered_decision_table
        first_true_wins: true
        unknown_condition: continue_without_treating_as_false_evidence
        rows:
        - when:
            op: eq
            args:
            - select: strengthened_conclusive_F3_failure
            - literal: true
          then:
            literal: CONFIRMED_NOT_VIABLE
        - when:
            op: eq
            args:
            - select: mandatory_unknown_or_unqualified_failure
            - literal: true
          then: null
        - when:
            op: eq
            args:
            - select: all_target_passed
            - literal: true
          then:
            literal: VALIDATED_IN_TARGET_CONTEXT
        - when:
            op: and
            args:
            - op: eq
              args:
              - select: all_target_or_comparable_passed
              - literal: true
            - op: eq
              args:
              - select: some_comparable
              - literal: true
            - op: eq
              args:
              - select: comparability_proven
              - literal: true
          then:
            literal: VALIDATED_IN_COMPARABLE_CONTEXT
        - when:
            op: and
            args:
            - op: eq
              args:
              - select: mixed_passed_and_testable
              - literal: true
            - op: eq
              args:
              - select: no_failure_unknown
              - literal: true
          then:
            literal: PARTIALLY_VALIDATED
        - when:
            op: and
            args:
            - op: eq
              args:
              - select: all_testable
              - literal: true
            - op: eq
              args:
              - select: bounded_methods_defined
              - literal: true
            - op: eq
              args:
              - select: no_passed
              - literal: true
          then:
            literal: NOT_VALIDATED_BUT_TESTABLE
        otherwise: null
        strengthened_failure_required:
        - defined_criterion_conditions
        - valid_test_analysis
        - confirmed_failure
        - own_F3_cause
        - bounded_remediation_assessed
        - no_bounded_remediation_identified_confirmed
        bounded_remediation_available: RETEST_REQUIRED_NOT_CONFIRMED_NONVIABLE
        unknown_remediation: null
        conclusive_failure_other_test_unknowns: DO_NOT_REVERSE_CONCLUSIVE_FAILURE
        bypass_other_F3_components: false
      output:
        type: validation_enum_or_null
      dependency_refs:
      - '#/criteria/F3/rules/F3_COMPARABILITY_v2.0'
    DERIVE_F3_VALIDATION_REQUIREMENT_v2.0:
      rule_id: DERIVE_F3_VALIDATION_REQUIREMENT_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§12.7
      kind: DERIVATION
      input_refs:
      - '#/methodology/type_catalog/RuleEvaluationContext'
      precondition_refs: []
      definition:
        operator: strict_min
        collection: included_remaining_material_uncertainties
        qualified_level_mapping_ref: '#/criteria/F3/rules/F3_VALIDATION_REQUIREMENT_v2.0'
        required_evidence:
        - scope
        - tested_uncertainty
        - success_criteria
        - positive_level_classification
        confirmed_no_remaining_material_uncertainty: NONE
        unconfirmed_empty: null
        score_relevant_unknown: null
        excluded_drivers:
        - time
        - cost
        - team
        output_level_from_min_score:
          5: NONE
          4: CONFIRMATORY_TEST
          3: BOUNDED_POC
          2: CRITICAL_POC
          1: R_AND_D
      output:
        type: validation_requirement_enum_or_null
      dependency_refs:
      - '#/criteria/F3/rules/F3_VALIDATION_REQUIREMENT_v2.0'
evidence_policy:
  statuses:
  - Confirmed
  - Derived
  - Inferred
  - Unknown
  source_types:
  - registry
  - interview
  - document
  - system_data
  - calculated
  fact_requirements:
    record_ref: '#/methodology/type_catalog/Fact'
    numeric_allowed_statuses:
    - Confirmed
    - Derived
    derived_rule_required: true
    inferred_eligible: false
    unknown_eligible: false
    registry_coordinates_required:
    - RegistryVersion
    - SourceRow
    - SourceCell
    registry_content_is_hypothesis_qualification: false
    input_coercion: false
    risk_rule_ref: '#/evidence_policy/rules/RISK_REQUIRES_VERIFICATION_v2.0'
  conflict_policy:
    resolution_capability: RESOLVE_CONFLICT
    domain_authority_required: true
    dispositions:
    - CONTEXT_SEPARATED
    - SOURCE_SUPERSEDED
    - PROPOSITION_REVISED
    - ONE_VALUE_CONFIRMED_APPLICABLE
    retain_originals: true
    automatic_winner: false
    all_null_reasons_retained: true
    reason_labels:
    - MISSING_REQUIRED_INPUT
    - UNKNOWN_INPUT
    - UNCONFIRMED_INPUT
    - INVALID_INPUT
    - INELIGIBLE_EVIDENCE
    - INSUFFICIENT_EVIDENCE
    - CONTEXT_UNDEFINED
    - CONTEXT_MISMATCH
    - UNRESOLVED_SCORING_CONFLICT
  trace_requirements:
    required:
    - context_versions
    - root_rule
    - branch
    - fact_versions
    - evidence_versions
    - confirmation_basis_specific_refs
    - qualification_refs
    - included_excluded_propositions
    - exclusion_reasons
    - owner_residuals
    - selected_definitions
    - component_mappings
    - all_minimum_values_and_ties
    - null_reasons
    - conflicts
    - concerns
    synthetic_evidence: false
  rules:
    COMMON_CONTEXT_EVIDENCE_v2.0:
      rule_id: COMMON_CONTEXT_EVIDENCE_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§3–6
      kind: POLICY
      input_refs:
      - '#/evidence_policy/fact_requirements'
      precondition_refs: []
      definition:
        operator: all
        predicates:
        - valid_type_value_unit
        - eligible_status
        - basis_or_registered_derivation_valid
        - sufficient_evidence
        - qualified_branch
        - compatible_context_period_population_case_unit
        - no_affecting_conflict
        derived_closure_must_terminate_in_eligible_confirmed: true
        on_failure: INELIGIBLE
      output:
        type: eligibility
      dependency_refs:
      - '#/confirmation_policy/rules/CONFIRMATION_ELIGIBILITY_v2.0'
      - '#/applicability_policy/rules/EVIDENCE_CONTEXT_ELIGIBILITY_v2.0'
    COMMON_CONFLICT_NULL_v2.0:
      rule_id: COMMON_CONFLICT_NULL_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§7
      kind: POLICY
      input_refs:
      - '#/evidence_policy/conflict_policy'
      precondition_refs: []
      definition:
        operator: ordered_decision_table
        rows:
        - when:
            op: eq
            args:
            - select: affecting_unresolved_conflict
            - literal: true
          then: null
        otherwise: CONTINUE_OWN_RULE
        preserve_all_reasons: true
        winner_selection: false
      output:
        type: null_or_continue
      dependency_refs: []
    RISK_REQUIRES_VERIFICATION_v2.0:
      rule_id: RISK_REQUIRES_VERIFICATION_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§16
      kind: POLICY
      input_refs:
      - '#/methodology/type_catalog/RuleEvaluationContext'
      precondition_refs: []
      definition:
        operator: ordered_decision_table
        first_true_wins: true
        unknown_condition: continue_without_treating_as_false_evidence
        rows:
        - when:
            op: eq
            args:
            - select: specific_unconfirmed_potential_constraint_affecting_assessment
            - literal: true
          then:
            risk: RISK_REQUIRES_VERIFICATION
            required_fields:
            - grounds
            - scope
            - affected_propositions_criteria
            - required_verification
            - domain_role
        otherwise: null
      output:
        type: risk_or_null
      dependency_refs: []
confirmation_policy:
  basis_definitions:
    HUMAN_CONFIRMATION:
      required_predicates:
      - capability_CONFIRM
      - binding_verified_authority_basis
      - binding_active_at_confirmation
      - binding_scope_match
      - policy_satisfied
      required_record_refs:
      - actor
      - role_binding
      universal_source_binding: false
    AUTHORITATIVE_SOURCE_ATTESTATION:
      required_predicates:
      - source_admissible
      - authority_domain_sufficient
      - version_current_effective_for_content_period
      - source_scope_match
      - exact_attestation_verified
      - policy_satisfied
      required_record_refs:
      - authoritative_source
      - source_version
