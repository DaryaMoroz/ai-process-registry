        score_dependency: false
        affecting_conflict: UNKNOWN
      output:
        type: blocker_status
      dependency_refs:
      - '#/blockers/rules/BLOCK_PREDICATE_LOGIC_v2.0'
      - '#/owner_filtering/rules/COMMON_OWNER_FILTER_v2.0'
      - '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
aggregation:
  rules:
    COMMON_STRICT_MIN_v2.0:
      rule_id: COMMON_STRICT_MIN_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§9
      kind: AGGREGATION
      input_refs:
      - '#/methodology/type_catalog/RuleEvaluationContext'
      precondition_refs: []
      definition:
        operator: strict_min
        mandatory_unknown_or_conflict: null
        empty: null
        complete_nonempty: MINIMUM_ALL_SCORES
        allowed_scores:
        - 1
        - 2
        - 3
        - 4
        - 5
        all_ties_retained: true
      output:
        type: score_or_null
      dependency_refs: []
    VALUE_AGGREGATION_v2.0:
      rule_id: VALUE_AGGREGATION_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§15
      kind: AGGREGATION
      input_refs:
      - '#/aggregation/common_formula'
      - '#/axes/VALUE'
      precondition_refs: []
      definition:
        operator: record
        formula_ref: '#/aggregation/common_formula'
        axis_binding_ref: '#/aggregation/axis_bindings/VALUE'
        intra_axis_compatible_required: true
        on_incompatible_or_unknown: null
        blocker_penalty: false
      output:
        type: axis_aggregate_or_null
      dependency_refs:
      - '#/compatibility/rules/AXIS_COMPATIBILITY_v2.0'
    FEASIBILITY_AGGREGATION_v2.0:
      rule_id: FEASIBILITY_AGGREGATION_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§15
      kind: AGGREGATION
      input_refs:
      - '#/aggregation/common_formula'
      - '#/axes/FEASIBILITY'
      precondition_refs: []
      definition:
        operator: record
        formula_ref: '#/aggregation/common_formula'
        axis_binding_ref: '#/aggregation/axis_bindings/FEASIBILITY'
        intra_axis_compatible_required: true
        on_incompatible_or_unknown: null
        blocker_penalty: false
      output:
        type: axis_aggregate_or_null
      dependency_refs:
      - '#/compatibility/rules/AXIS_COMPATIBILITY_v2.0'
  common_formula:
    evaluation_order:
    - known_count
    - unknown_count
    - known_sum
    - coverage
    - range_min
    - range_max
    - full_score
    fields:
      known_count:
        op: count
        args:
        - op: filter
          args:
          - select: criteria_scores
          - op: is_numeric
            args:
            - select: item
            minimum: 1
            maximum: 5
            integer: true
            finite: true
            boolean_is_number: false
          bind: item
      unknown_count:
        op: subtract
        args:
        - literal: 5
        - select: known_count
      known_sum:
        op: sum
        args:
        - op: filter
          args:
          - select: criteria_scores
          - op: is_numeric
            args:
            - select: item
            minimum: 1
            maximum: 5
            integer: true
            finite: true
            boolean_is_number: false
          bind: item
        empty: 0
      coverage:
        op: divide
        args:
        - select: known_count
        - literal: 5
      range_min:
        op: add
        args:
        - select: known_sum
        - op: multiply
          args:
          - select: unknown_count
          - literal: 1
      range_max:
        op: add
        args:
        - select: known_sum
        - op: multiply
          args:
          - select: unknown_count
          - literal: 5
      full_score:
        operator: ordered_decision_table
        first_true_wins: true
        unknown_condition: continue_without_treating_as_false_evidence
        rows:
        - when:
            op: eq
            args:
            - select: known_count
            - literal: 5
          then:
            select: known_sum
        otherwise: null
    requires_intra_axis_compatible: true
    normal_aggregate_on_incompatible_or_unknown: null
    criterion_diagnostics_retained: true
    normalization: false
    weighting: false
    combined_axis: false
    input_collection:
      name: criteria_scores
      type: list<score_or_null>
      cardinality: 5
      item_type:
        integer_minimum: 1
        integer_maximum: 5
        nullable: true
      source: BOUND_AXIS_FIVE_CRITERION_RESULTS
      eligibility_and_intra_axis_compatibility_required: true
  axis_bindings:
    VALUE:
      criterion_refs:
      - '#/criteria/V1'
      - '#/criteria/V2'
      - '#/criteria/V3'
      - '#/criteria/V4'
      - '#/criteria/V5'
      rule_ref: '#/aggregation/rules/VALUE_AGGREGATION_v2.0'
    FEASIBILITY:
      criterion_refs:
      - '#/criteria/F1'
      - '#/criteria/F2'
      - '#/criteria/F3'
      - '#/criteria/F4'
      - '#/criteria/F5'
      rule_ref: '#/aggregation/rules/FEASIBILITY_AGGREGATION_v2.0'
  incompatibility_gate: '#/compatibility/rules/AXIS_COMPATIBILITY_v2.0'
evidence_stages:
  ordered_stage_rules:
  - stage: VERIFIED_SCORE
    all_required_predicates:
    - all_five_numeric_scores_1_to_5
    - coverage_is_1
    - mandatory_evidence_eligible_qualified
    - all_completeness_gates_pass
    - no_affecting_unresolved_conflict
    - context_compatible
    - context_version_refs_fixed
    - deterministic_execution
    - criterion_specific_verification_complete
    confirmed_blocker_disqualifies: false
  - stage: INTERVIEW_SCORE
    condition:
      op: eq
      args:
      - select: eligible_used_closure_contains_confirmed_non_registry_fact
      - literal: true
    source_types:
    - interview
    - document
    - system_data
    partial_allowed: true
  - stage: PRE_SCORE
    condition:
      op: and
      args:
      - op: eq
        args:
        - select: eligible_used_basis_exists
        - literal: true
      - op: eq
        args:
        - select: used_closure_only_confirmed_registry_or_explicit_derivation
        - literal: true
  no_basis_outcome: null
  rules:
    EVIDENCE_STAGE_v2.0:
      rule_id: EVIDENCE_STAGE_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§19.1
      kind: STAGE
      input_refs:
      - '#/evidence_stages/ordered_stage_rules'
      precondition_refs: []
      definition:
        operator: ordered_decision_table
        ordered_rules_ref: '#/evidence_stages/ordered_stage_rules'
        otherwise: null
        manual_assignment: false
        unused_attached_candidates_affect_stage: false
        derived_operands_included_in_source_classification: true
        axis_local: true
        value_v2_active_labor_gate: true
        v3_confirmed_only: true
        workflow_lifecycle_is_stage: false
      output:
        type: evidence_stage_or_null
      dependency_refs:
      - '#/compatibility/rules/AXIS_COMPATIBILITY_v2.0'
      - '#/evidence_policy/rules/COMMON_CONTEXT_EVIDENCE_v2.0'
      - '#/evidence_policy/rules/COMMON_CONFLICT_NULL_v2.0'
compatibility:
  intra_axis:
    VALUE:
      context_ref: '#/methodology/context_requirements/ProcessValueBaseline'
      same_compatible_fields:
      - baseline_id
      - baseline_version
      - period
      - population
      - case_unit
      - scope
      - fact_snapshot
    FEASIBILITY:
      context_ref: '#/methodology/context_requirements/HypothesisAssessment'
      same_compatible_fields:
      - hypothesis_version
      - scope_version
      - process_context
  cross_axis:
    status_enum:
    - COMPATIBLE
    - REVALIDATION_REQUIRED
    - INCOMPATIBLE
    - UNKNOWN
    compatible_required:
    - same_process_primary_analysis_unit
    - compatible_process_baseline_context
    - hypothesis_assumptions_evidence_apply_to_baseline
    baseline_and_improvement_scopes_may_differ: true
    ordinary_pair_required_status: COMPATIBLE
    other_statuses: PRESERVE_SEPARATE_SNAPSHOTS_WITH_REASON
    automatic_replacement_or_human_decision: false
  migration:
    historical_v1_1_relabel: false
    historical_overwrite: false
    legacy_marker_v2_identity: false
    reusable_facts_require_requalification: true
    v2_result_requires_new_identity_evaluation: true
    frozen_parser_mapping_slices_changed: false
    staffing_fte_savings_derived: false
    production_activation: false
    legacy_no_automatic_mapping:
    - LEGAL_INFOSEC_PDN_BLOCK
    - NO_VIABLE_MVP_SCOPE
    - slice02.pre-score.v1
    legacy_shortcut_rejected:
    - REVIEWED_NO_MATERIAL_CONSTRAINT
  rules:
    AXIS_COMPATIBILITY_v2.0:
      rule_id: AXIS_COMPATIBILITY_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§19.2
      kind: COMPATIBILITY
      input_refs:
      - '#/compatibility/intra_axis'
      - '#/compatibility/cross_axis'
      precondition_refs: []
      definition:
        operator: ordered_decision_table
        intra_axis_requirements_ref: '#/compatibility/intra_axis'
        cross_axis_requirements_ref: '#/compatibility/cross_axis'
        cross_rows:
        - when:
            op: eq
            args:
            - select: proved_context_mismatch
            - literal: true
          then:
            literal: INCOMPATIBLE
        - when:
            op: eq
            args:
            - select: previous_compatibility_lost_after_relevant_change
            - literal: true
          then:
            literal: REVALIDATION_REQUIRED
        - when:
            op: eq
            args:
            - select: all_cross_compatibility_requirements_qualified
            - literal: true
          then:
            literal: COMPATIBLE
        otherwise: UNKNOWN
        intra_noncompatible_normal_aggregate: null
        intra_unknown_normal_aggregate: null
        cross_noncompatible_destroys_separate_valid_axes: false
      output:
        type: compatibility_status
      dependency_refs: []
dependency_rules:
  graph_requirements:
    node_families:
    - source_facts
    - derived_inputs
    - classifications
    - selected_definitions
    - confirmations
    - basis_specific_role_bindings_sources_policies
    - qualifications
    - completeness
    - criticality
    - applicability
    - owners_atomicity_residuals
    - conflicts_dispositions
    - context_versions
    direct_and_transitive_closure: true
    typed_versioned_refs: true
    derivation_cycles_allowed: false
    new_primary_alternative_input_changes_selection_dependency: true
  triggers:
  - fact_source_version_change
  - hypothesis_scope_approach_change
  - process_baseline_change
  - selection_plan_path_component_effect_design_change
  - owner_criticality_applicability_completeness_change
  - evidence_validity_currentness_change
  - new_conflict_or_disposition
  - binding_source_policy_invalidation
  - methodology_config_schema_evidence_confirmation_policy_version_change
  snapshot_requirements:
    required:
    - axis_snapshot_id
    - axis_snapshot_version
    - process_primary_analysis_unit
    - baseline_or_hypothesis_scope_process_context
    - input_snapshot_fact_derived_evidence_versions
    - confirmation_basis_and_branch_specific_refs
    - qualification_refs
    - conflicts_dispositions
    - collections_completeness_criticality_applicability_owners
    - selected_definitions_effect_set_designs
    - rule_methodology_config_schema_evidence_confirmation_policy_versions
    - calculated_at
    - criterion_results_origins
    - trace_concerns
    - compatibility
    - evidence_stage
    registry_required_when_used:
    - RegistryVersion
    - SourceRow
    - SourceCell
    immutable: true
    new_assessment_new_snapshot: true
    atomic_with_mixed_origins: true
    assessment_time_fixed: true
  reuse:
    result_origin_enum:
    - REUSED
    - RECALCULATED
    reused_required:
    - reused_from_snapshot_id
    - concrete_criterion_provenance
    - proved_compatible_entire_closure
    unknown_compatibility: RECALCULATED
    recheck_for_new_snapshot:
    - blockers
    - aggregation
    - compatibility
    - evidence_stage
    history_overwrite: false
    rule_ref: '#/dependency_rules/rules/SNAPSHOT_REUSE_v2.0'
  rules:
    SNAPSHOT_REUSE_v2.0:
      rule_id: SNAPSHOT_REUSE_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§19.3
      kind: REUSE
      input_refs:
      - '#/dependency_rules/graph_requirements'
      - '#/dependency_rules/reuse'
      precondition_refs: []
      definition:
        operator: ordered_decision_table
        first_true_wins: true
        unknown_condition: continue_without_treating_as_false_evidence
        rows:
        - when:
            op: and
            args:
            - op: eq
              args:
              - select: all_dependency_versions_context_policies_compatible
              - literal: true
            - op: eq
              args:
              - select: no_new_affecting_conflict_owner_applicability_dependency_change
              - literal: true
            - op: eq
              args:
              - select: source_snapshot_and_concrete_result_provenance_present
              - literal: true
          then:
            literal: REUSED
        otherwise:
          literal: RECALCULATED
      output:
        type: result_origin
      dependency_refs: []
    CONFIRMATION_INVALIDATION_v2.0:
      rule_id: CONFIRMATION_INVALIDATION_v2.0
      spec_refs:
      - SCORING_ENGINE_SPEC_V2_DRAFT.md:0.4:§6.3
      kind: POLICY
      input_refs:
      - '#/dependency_rules/graph_requirements'
      - '#/confirmation_policy/binding_requirements'
      precondition_refs: []
      definition:
        operator: ordered_decision_table
        rows:
        - when:
            op: eq
            args:
            - select: authority_status
            - literal: REVOKED
          then:
            new_confirmations: FORBIDDEN
            history: AUDIT_VALID_IF_AUTHORITY_VALID_AT_CONFIRMATION
        - when:
            op: eq
            args:
            - select: authority_status
            - literal: INVALIDATED
          then:
            current_eligibility: REVALIDATE_TRANSITIVE_CLOSURE
            cascade:
            - proposition
            - Derived
            - classifications
            - criterion
            - blocker
            - aggregate
            - evidence_stage
            history: IMMUTABLE
            new_results: NEW_SNAPSHOTS
        otherwise: NORMAL_CURRENTNESS_AND_CONTEXT_CHECKS
        qualification_binding_included: true
      output:
        type: invalidation_action
      dependency_refs: []
