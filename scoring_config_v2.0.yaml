          - component_set_complete
          - all_critical_material_capabilities_covered
          - selected_bindings_defined
          - main_technical_interaction_logic_defined
          - success_criterion_per_required_capability_defined
          required_false_or_unknown: null
          required_empty: null
          optional_exclusion: CONFIRMED_ONLY
        output:
          type: complete_or_null
        dependency_refs: []
      F3_PATTERN_MATURITY_v2.0:
