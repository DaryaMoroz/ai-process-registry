methodology:
  type_catalog:
    primitives:
      id:
        type: string
        min_length: 1
      version:
        type: string
        min_length: 1
        comparison: EXACT_IDENTITY
      number:
        finite: true
        coercion: false
        boolean_is_number: false
      score_or_null:
        integer_minimum: 1
        integer_maximum: 5
        nullable: true
      truth:
        enum:
        - 'TRUE'
        - 'FALSE'
        - UNKNOWN
      timestamp:
        timezone_required: true
      reference:
        resolution: EXACTLY_ONE_TYPED_VERSIONED_TARGET
    expression:
      allowed_operators:
      - and
      - or
      - not
      - eq
      - ne
      - le
      - gt
      - ge
      - in
      - all
      - any
      - count
      - sum
      - multiply
      - divide
      - min
      - max
      - strict_min
      - subtract
      - add
      - all_eligible
      - filter
      - is_null
      - is_numeric
      - ordered_decision_table
      - enum_lookup
      - numeric_ranges
      - record
      - cardinality
      and_truth_table:
        any_false: 'FALSE'
        all_true: 'TRUE'
        otherwise: UNKNOWN
      or_truth_table:
        any_true: 'TRUE'
        all_false: 'FALSE'
        otherwise: UNKNOWN
      not_truth_table:
        'TRUE': 'FALSE'
        'FALSE': 'TRUE'
        UNKNOWN: UNKNOWN
      unknown_comparison: UNKNOWN
      empty_quantification_requires_explicit_completeness: true
      selectors:
        root: current_rule_input
        item: bound_collection_item
        no_value: UNKNOWN
        literal_null: null_value_not_zero
      qualified_predicate:
        value_source: confirmed_context_qualified_proposition
        ineligible_or_conflict: UNKNOWN
        false_requires_positive_refutation: true
      no_dynamic_code: true
      predicate_value_conversion:
        boolean_true: 'TRUE'
        boolean_false: 'FALSE'
        missing_or_ineligible: UNKNOWN
        unknown_is_disqualifying_false: false
      rule_binding_requirements:
        qualified_predicate_fields: EVIDENCE_BACKED_CONTEXT_QUALIFIED_INPUTS
        required_named_predicates: ALL_PRESENT_OR_UNKNOWN
        derived_named_summaries: DETERMINISTIC_REQUIRED_PREDICATE_COMPOSITION_ONLY
        free_text_or_llm_predicates: false
      strict_min_input_shape: SCALAR_OR_COLLECTION_SCORE_LEAVES_COMPLETE_REQUIRED_SET
      operator_contracts:
        all_eligible:
          input: ONE_TYPED_RECORD_OR_COLLECTION
          required_parameters:
          - policy_ref
          - purpose
          input_type_parameters:
          - input_descriptor_ref
          - input_type_ref
          evaluation: APPLY_REFERENCED_COMMON_CONTEXT_EVIDENCE_AND_DECLARED_INPUT_TYPE
          output_type: boolean
          true_iff: EVERY_REFERENCED_ELIGIBILITY_TYPE_AND_CONTEXT_GATE_SUCCEEDS
          on_missing_invalid_unconfirmed_unknown_or_conflict: false
          negative_result_is_domain_refutation: false
        filter:
          input: typed_collection
          predicate: typed_expression
          binding_parameter: bind
          output: same_item_type_collection
          include_iff_predicate: true
          unknown_predicate_item: NOT_INCLUDED_NOT_DOMAIN_FALSE
          order: PRESERVE_INPUT_ORDER
        count:
          input: collection
          output: nonnegative_integer
        add:
          input:
          - finite_number
          - finite_number
          output: finite_number
          meaning: ARITHMETIC_ADDITION_ONLY
        subtract:
          input:
          - finite_number
          - finite_number
          output: finite_number
          meaning: ARITHMETIC_SUBTRACTION_ONLY
        is_numeric:
          input: value
          output: boolean
          parameters:
          - minimum
          - maximum
          - integer
          - finite
          - boolean_is_number
          missing_null_non_numeric: false
        ordered_decision_table:
          condition_type: truth_or_boolean
          first_matching_value: true
          unknown_condition_enum:
          - continue_without_treating_as_false_evidence
          unknown_is_false_evidence: false
          unmatched_uses: EXPLICIT_OTHERWISE_OR_NULL
      predicate_reference_contract:
        reference_field: predicate_ref
        target_fields:
        - type
        - expression
        result_type: DECLARED_TARGET_TYPE
        cyclic_references: INVALID_CONFIG
      conditional_field_semantics:
        when: BRANCH_NOT_TAKEN_WITHOUT_DOMAIN_FALSE
        required_when: REQUIREDNESS_NOT_RESOLVED_MANDATORY_INPUT_NOT_EXCLUDED
        condition: BRANCH_NOT_TAKEN_WITHOUT_DOMAIN_FALSE
    Fact:
      required:
        fact_id:
          type: id
          required: true
        version:
          type: version
          required: true
        value:
          type: INPUT_DESCRIPTOR_DECLARED_TYPE
          required: true
        unit:
          type: string
          required: true
        status:
          enum_ref: '#/evidence_policy/statuses'
